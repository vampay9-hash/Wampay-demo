<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امضای قرارداد خرید | وام پی</title>
<link href="css/fonts/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root {
    --primary: #0b3b23; --primary-light: #1a5c3a; --primary-dark: #062416;
    --gold: #d4a62a; --gold-light: #f0c651;
    --text: #1a2b22; --text-muted: #6b7d73;
    --bg: #f4f7f4; --bg-card: #ffffff; --border: #e0e8e3;
    --error: #c0392b; --success: #1e8e4a; --warning: #e67e22; --info: #2980b9;
    --paper: #fffef8;
    --shadow-sm: 0 2px 8px rgba(11,59,35,0.06);
    --shadow-md: 0 8px 24px rgba(11,59,35,0.10);
    --shadow-lg: 0 16px 48px rgba(11,59,35,0.18);
    --radius: 14px; --radius-sm: 8px;
    --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
    --text: #e8ede9; --text-muted: #8fa398;
    --bg: #0a1410; --bg-card: #10201a; --border: #1f3429;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.7;
    transition: background 0.3s, color 0.3s;
    background-image:
        radial-gradient(circle at 10% 10%, rgba(212,166,42,0.05), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(11,59,35,0.07), transparent 40%);
}
.sign-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; box-shadow: var(--shadow-md);
    position: sticky; top: 0; z-index: 100;
}
.sign-header__inner {
    max-width: 1100px; width: 100%; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.sign-logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 18px; color: #fff; text-decoration: none;
}
.sign-logo__icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 12px rgba(212,166,42,0.4);
}
.sign-header__actions { display: flex; gap: 8px; align-items: center; }
.sign-theme-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff;
    cursor: pointer; font-size: 16px; transition: var(--transition);
}
.sign-theme-btn:hover { background: rgba(255,255,255,0.18); }
.sign-back-link {
    color: #fff; text-decoration: none; font-size: 13px;
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    transition: var(--transition);
}
.sign-back-link:hover { background: rgba(255,255,255,0.12); }

.sign-main { max-width: 900px; margin: 0 auto; padding: 24px 20px 100px; }

.sign-hero { text-align: center; margin-bottom: 22px; }
.sign-hero__badge {
    display: inline-block; padding: 6px 16px;
    background: rgba(30,142,74,0.12); color: var(--success);
    border-radius: 999px; font-size: 12px; font-weight: 800; margin-bottom: 10px;
}
.sign-hero__title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
.sign-hero__subtitle { color: var(--text-muted); font-size: 14px; max-width: 560px; margin: 0 auto; }

/* Progress Steps */
.sign-steps {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin: 24px 0 28px; flex-wrap: wrap;
}
.sign-step { display: flex; align-items: center; gap: 6px; }
.sign-step__num {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-card); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: var(--text-muted);
    transition: var(--transition);
}
.sign-step--active .sign-step__num {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 0 0 4px rgba(11,59,35,0.15);
}
.sign-step--done .sign-step__num {
    background: var(--success); border-color: var(--success); color: #fff;
}
.sign-step__line { width: 40px; height: 2px; background: var(--border); border-radius: 2px; }
.sign-step__line--done { background: var(--success); }

/* Info Banner */
.info-banner {
    background: linear-gradient(135deg, rgba(212,166,42,0.10), rgba(11,59,35,0.05));
    border: 2px solid rgba(212,166,42,0.35);
    border-radius: var(--radius);
    padding: 18px 22px; margin-bottom: 22px;
    display: flex; gap: 14px; align-items: flex-start;
}
.info-banner__icon { font-size: 32px; flex-shrink: 0; }
.info-banner__content { flex: 1; }
.info-banner__title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: var(--primary); }
[data-theme="dark"] .info-banner__title { color: var(--gold-light); }
.info-banner__desc { font-size: 13px; color: var(--text-muted); line-height: 1.9; }
.info-banner__desc strong { color: var(--text); }

/* Contract Number Banner */
.contract-banner {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff; border-radius: var(--radius);
    padding: 16px 22px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; box-shadow: var(--shadow-md);
    position: relative; overflow: hidden;
    flex-wrap: wrap;
}
.contract-banner::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(212,166,42,0.15);
}
.contract-banner__right { position: relative; z-index: 1; }
.contract-banner__label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
.contract-banner__value {
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: var(--gold-light); font-family: monospace; direction: ltr;
}
.contract-banner__left { position: relative; z-index: 1; text-align: left; }
.contract-banner__amount {
    font-size: 22px; font-weight: 800; color: var(--gold-light);
}
.contract-banner__amount-label { font-size: 11px; opacity: 0.85; margin-bottom: 2px; }

/* Contract Paper */
.contract-paper-wrap {
    position: relative; margin-bottom: 20px;
}
.contract-paper {
    background: var(--paper); color: #1a2b22;
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: var(--shadow-md);
    border: 2px solid rgba(11,59,35,0.1);
    max-height: 500px; overflow-y: auto;
    font-size: 13.5px; line-height: 2.1;
    white-space: pre-wrap;
    font-family: 'Vazirmatn', monospace;
    scroll-behavior: smooth;
}
[data-theme="dark"] .contract-paper { background: #f8f8f5; color: #1a2b22; }
.contract-paper::-webkit-scrollbar { width: 8px; }
.contract-paper::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
.contract-paper::-webkit-scrollbar-thumb { background: rgba(11,59,35,0.3); border-radius: 4px; }
.contract-paper::-webkit-scrollbar-thumb:hover { background: rgba(11,59,35,0.5); }

.scroll-indicator {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--primary-dark); font-weight: 800;
    padding: 8px 18px; border-radius: 999px;
    font-size: 12px; pointer-events: none;
    box-shadow: 0 4px 12px rgba(212,166,42,0.4);
    animation: bounce 1.5s ease-in-out infinite;
    transition: opacity 0.3s;
}
.scroll-indicator--hidden { opacity: 0; }
@keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
}

/* Sections */
.sign-card {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 18px;
    opacity: 0.5; pointer-events: none;
    transition: var(--transition);
}
.sign-card--enabled { opacity: 1; pointer-events: auto; }
.sign-card__title {
    font-size: 16px; font-weight: 800; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
}
.sign-card__desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }

/* Checklist */
.clause-list { display: flex; flex-direction: column; gap: 10px; }
.clause-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px; border-radius: var(--radius-sm);
    background: var(--bg); border: 1.5px solid var(--border);
    cursor: pointer; transition: var(--transition);
}
.clause-item:hover { border-color: var(--primary); }
.clause-item--checked { background: rgba(30,142,74,0.06); border-color: var(--success); }
.clause-item input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--primary);
    cursor: pointer; flex-shrink: 0; margin-top: 3px;
}
.clause-item__text { flex: 1; font-size: 13px; line-height: 1.8; }
.clause-item__text strong { color: var(--primary); font-weight: 800; }
[data-theme="dark"] .clause-item__text strong { color: var(--gold-light); }
.clause-item--important {
    background: linear-gradient(135deg, rgba(212,166,42,0.08), rgba(11,59,35,0.04));
    border-color: rgba(212,166,42,0.5);
}
.clause-item--important .clause-item__text strong { color: var(--warning); }

/* Signature Canvas */
.signature-wrap {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 12px; border: 2px dashed var(--border);
    transition: var(--transition);
}
.signature-wrap--active { border-color: var(--success); }
.signature-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
}
.signature-header__label { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.signature-header__status {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
    background: rgba(230,126,34,0.12); color: var(--warning);
}
.signature-header__status--ok { background: rgba(30,142,74,0.12); color: var(--success); }

#signatureCanvas {
    width: 100%; height: 220px;
    background: #fff; border-radius: 8px;
    cursor: crosshair; touch-action: none;
    border: 2px solid var(--border);
    display: block;
}
.signature-actions {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
}
.signature-actions button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text);
    font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: var(--transition);
}
.signature-actions button:hover { border-color: var(--primary); color: var(--primary); }
.signature-actions .clear-btn:hover { border-color: var(--error); color: var(--error); }

/* OTP Box */
.otp-box {
    background: linear-gradient(135deg, rgba(41,128,185,0.06), rgba(11,59,35,0.04));
    border: 2px solid rgba(41,128,185,0.3);
    border-radius: var(--radius-sm); padding: 18px;
    text-align: center;
}
.otp-box__title {
    font-size: 14px; font-weight: 800; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.otp-box__desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
.otp-box__desc strong { color: var(--text); direction: ltr; display: inline-block; font-family: monospace; }
.otp-inputs {
    display: flex; gap: 8px; justify-content: center; direction: ltr;
    margin: 14px 0;
}
.otp-input {
    width: 48px; height: 56px; text-align: center;
    font-size: 22px; font-weight: 800;
    border-radius: 10px; border: 2px solid var(--border);
    background: var(--bg); color: var(--text);
    font-family: inherit; transition: var(--transition);
}
.otp-input:focus {
    outline: none; border-color: var(--info);
    box-shadow: 0 0 0 4px rgba(41,128,185,0.15);
    transform: translateY(-2px);
}
.otp-hint {
    font-size: 11px; color: var(--text-muted); margin-top: 6px;
}
.otp-hint code {
    background: rgba(11,59,35,0.08); padding: 2px 6px; border-radius: 4px;
    font-family: monospace; font-weight: 700;
    color: var(--primary);
}
.otp-status {
    font-size: 13px; font-weight: 700; margin-top: 10px;
    display: none;
}
.otp-status--error { color: var(--error); display: block; }
.otp-status--success { color: var(--success); display: block; }

/* Buttons */
.btn {
    padding: 14px 22px; border-radius: var(--radius-sm); border: none;
    font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: var(--transition);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none;
}
.btn--primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; box-shadow: 0 6px 16px rgba(11,59,35,0.25);
}
.btn--primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,59,35,0.35); }
.btn--primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn--success {
    background: linear-gradient(135deg, var(--success), #2ecc71);
    color: #fff; box-shadow: 0 6px 16px rgba(30,142,74,0.3);
}
.btn--success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(30,142,74,0.45); }
.btn--gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--primary-dark); box-shadow: 0 6px 16px rgba(212,166,42,0.3);
}
.btn--gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(212,166,42,0.45); }
.btn--ghost {
    background: transparent; color: var(--text-muted);
    border: 1.5px solid var(--border);
}
.btn--ghost:hover { background: var(--bg); color: var(--text); }
.btn--block { width: 100%; }
.btn__spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite; display: none;
}
.btn--loading .btn__spinner { display: block; }
.btn--loading .btn__text { opacity: 0.7; }
@keyframes spin { to { transform: rotate(360deg); } }

.sign-actions {
    display: flex; gap: 12px; margin-top: 20px;
}
.sign-actions .btn { flex: 1; }

/* Success Screen */
.success-screen {
    text-align: center; padding: 40px 20px;
}
.success-icon {
    width: 100px; height: 100px; margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--success), #2ecc71);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; color: #fff;
    box-shadow: 0 12px 40px rgba(30,142,74,0.4);
    animation: pop 0.6s cubic-bezier(0.68,-0.55,0.27,1.55);
}
@keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.success-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--success); }
.success-desc { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
.success-box {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 20px; text-align: right; margin-bottom: 20px;
    border: 1px solid var(--border);
}
.success-box__row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px dashed var(--border);
    font-size: 14px;
}
.success-box__row:last-child { border-bottom: none; }
.success-box__row span:first-child { color: var(--text-muted); }
.success-box__row span:last-child { font-weight: 700; }

/* Alert */
.alert {
    padding: 14px 18px; border-radius: var(--radius-sm);
    font-size: 13px; margin-bottom: 16px;
    display: flex; gap: 10px; align-items: flex-start;
    line-height: 1.8;
}
.alert--info { background: rgba(41,128,185,0.08); color: var(--info); border-right: 4px solid var(--info); }
.alert--warning { background: rgba(230,126,34,0.10); color: var(--warning); border-right: 4px solid var(--warning); }
.alert--success { background: rgba(30,142,74,0.08); color: var(--success); border-right: 4px solid var(--success); }
.alert--error { background: rgba(192,57,43,0.08); color: var(--error); border-right: 4px solid var(--error); }

/* Loading Screen */
.loading-screen {
    text-align: center; padding: 80px 20px;
    color: var(--text-muted);
}
.loading-spinner {
    width: 50px; height: 50px; border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
}

/* Toast */
.toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--primary-dark); color: #fff;
    padding: 14px 22px; border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600;
    z-index: 9999; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; align-items: center; gap: 10px; max-width: 90%;
}
.toast--show { transform: translateX(-50%) translateY(0); }
.toast--error { background: var(--error); }
.toast--success { background: var(--success); }

/* Responsive */
@media (max-width: 640px) {
    .sign-main { padding: 16px 14px 80px; }
    .contract-paper { padding: 20px 18px; font-size: 12.5px; max-height: 400px; }
    .sign-hero__title { font-size: 20px; }
    .sign-hero__subtitle { font-size: 13px; }
    .otp-input { width: 42px; height: 50px; font-size: 18px; }
    .sign-actions { flex-direction: column-reverse; }
    .contract-banner { flex-direction: column; text-align: center; }
    .contract-banner__left { text-align: center; }
    #signatureCanvas { height: 180px; }
    .sign-step__line { width: 20px; }
}
</style>
</head>
<body>

<header class="sign-header">
    <div class="sign-header__inner">
        <a href="broker-dashboard.html" class="sign-logo">
            <div class="sign-logo__icon">✍️</div>
            <span>وام پی</span>
        </a>
        <div class="sign-header__actions">
            <button class="sign-theme-btn" id="themeBtn">🌙</button>
            <a href="broker-dashboard.html" class="sign-back-link">→ بازگشت</a>
        </div>
    </div>
</header>

<main class="sign-main" id="mainContainer">
    <!-- Loading -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div>در حال بارگذاری قرارداد...</div>
    </div>
</main>

<div class="toast" id="toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastText"></span>
</div>

<!-- Services -->
<script src="js/contract-service.js"></script>
<script src="js/financial-log-service.js"></script>
<script src="js/case-state-machine.js"></script>

<script>
(function () {
    'use strict';

    const OTP_CONFIG = { mock: true, mockCode: '12345' };

    const state = {
        broker: null,
        contract: null,
        caseData: null,
        invoice: null,
        signatureImage: null,
        pointCount: 0,
        otpVerified: false,
        otpCode: '',
        contractRead: false,
        checklistDone: false,
        stage: 1  // 1: read, 2: sign, 3: submit
    };

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const faNum = (n) => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const faPrice = (n) => Number(n || 0).toLocaleString('fa-IR');

    // ===== Toast =====
    function toast(msg, type = 'info') {
        const el = $('#toast');
        $('#toastIcon').textContent = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        $('#toastText').textContent = msg;
        el.className = 'toast toast--show';
        if (type === 'error') el.classList.add('toast--error');
        if (type === 'success') el.classList.add('toast--success');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('toast--show'), 3200);
    }

    // ===== Auth =====
    function checkAuth() {
        try {
            const cu = JSON.parse(localStorage.getItem('wamPayCurrentUser') || 'null');
            if (!cu || cu.role !== 'broker' || cu.status !== 'active') {
                toast('ابتدا وارد شوید', 'error');
                setTimeout(() => window.location.href = 'login.html', 900);
                return false;
            }
            const users = JSON.parse(localStorage.getItem('wamPayUsers') || '[]');
            state.broker = users.find(u => u.id === cu.id);
            if (!state.broker) { window.location.href = 'login.html'; return false; }
            return true;
        } catch (e) {
            window.location.href = 'login.html';
            return false;
        }
    }

    // ===== Load Contract =====
    function loadContract() {
        // از URL param
        const params = new URLSearchParams(window.location.search);
        let contractId = params.get('contract');
        let contract = null;

        if (contractId && window.WamPayContracts) {
            contract = WamPayContracts.getContractById(contractId);
        }

        // اگر پیدا نشد، اولین قرارداد خرید در انتظار امضا برای این کارگزار
        if (!contract && window.WamPayContracts) {

                c.status === 'draft' &&
                !c.signatures?.broker?.signed

        if (!contract) {
            showError('قراردادی برای امضا یافت نشد',

                'broker-dashboard.html');
            return false;
        }

        state.contract = contract;

        // دریافت پرونده
        const cases = JSON.parse(localStorage.getItem('wamPayApplications') || '[]');
        state.caseData = cases.find(c => c.id === contract.caseId);

        // دریافت فاکتور
        if (window.WamPayCreditInvoice) {
            state.invoice = WamPayCreditInvoice.getInvoiceById(contract.invoiceId);
        }

        return true;
    }

        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ===== Stage Tracking =====
    function updateStageUI() {
        // Stage 1: Contract
        if (state.contractRead) {
            $$('.sign-step[data-step="1"]')[0]?.classList.add('sign-step--done');
            $$('.sign-step[data-step="2"]')[0]?.classList.add('sign-step--active');

        // Stage 2: Checklist

            $('#cardSign')?.classList.add('sign-card--enabled');
            $$('.sign-step[data-step="2"]')[0]?.classList.add('sign-step--done');
            $$('.sign-step[data-step="3"]')[0]?.classList.add('sign-step--active');

        if (state.signatureImage && state.otpVerified) {
            $('#cardSubmit')?.classList.add('sign-card--enabled');
            $$('.sign-step[data-step="3"]')[0]?.classList.add('sign-step--done');

    // ===== Contract Scroll Detection =====
    function setupScrollDetection() {
        const paper = $('#contractPaper');
        const indicator = $('#scrollIndicator');
        if (!paper) return;

        // اگر متن کوتاه است، بلافاصله فعال کن
        if (paper.scrollHeight <= paper.clientHeight + 30) {
            markContractRead();
            return;
        }

        const check = () => {
            const scrolled = paper.scrollTop + paper.clientHeight;
            const total = paper.scrollHeight;
            if (scrolled >= total - 30) {
                markContractRead();
            }
        };
        paper.addEventListener('scroll', check);
    }

    function markContractRead() {
        if (state.contractRead) return;
        state.contractRead = true;
        $('#scrollIndicator')?.classList.add('scroll-indicator--hidden');
        $('#cardChecklist')?.classList.add('sign-card--enabled');
        toast('✅ متن قرارداد خوانده شد', 'success');
        updateStageUI();
    }

    // ===== Checklist =====
    function setupChecklist() {
        $$('.clause-check').forEach(cb => {
            cb.addEventListener('change', checkChecklistState);
        });
    }

    function checkChecklistState() {
        const all = $$('.clause-check');
        const checked = $$('.clause-check:checked');
        const allChecked = all.length === checked.length && all.length > 0;

        // Highlight items
        all.forEach(cb => {
            const item = cb.closest('.clause-item');
            if (item) item.classList.toggle('clause-item--checked', cb.checked);
        });

        if (allChecked && !state.checklistDone) {
            state.checklistDone = true;
            $('#cardSign')?.classList.add('sign-card--enabled');
            toast('✅ همه‌ی بندها تأیید شد', 'success');
            updateStageUI();
        } else if (!allChecked) {
            state.checklistDone = false;
            $('#cardSign')?.classList.remove('sign-card--enabled');
        }
    }

    // ===== Signature Canvas =====
    let canvasCtx, isDrawing = false, lastPoint = null;

    function initSignature() {
        const canvas = $('#signatureCanvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvasCtx = canvas.getContext('2d');
        canvasCtx.strokeStyle = '#0b3b23';
        canvasCtx.lineWidth = 2.5;
        canvasCtx.lineCap = 'round';
        canvasCtx.lineJoin = 'round';

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return { x: p.clientX - r.left, y: p.clientY - r.top };
        }
        function start(e) {
            e.preventDefault(); isDrawing = true;
            lastPoint = getPos(e); state.pointCount++;
            canvasCtx.beginPath();
            canvasCtx.arc(lastPoint.x, lastPoint.y, 1.25, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#0b3b23';
            canvasCtx.fill();
        }
        function move(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const p = getPos(e);
            canvasCtx.beginPath();
            canvasCtx.moveTo(lastPoint.x, lastPoint.y);
            canvasCtx.lineTo(p.x, p.y);
            canvasCtx.stroke();
            lastPoint = p; state.pointCount++;
            if (state.pointCount > 5 && !state.signatureImage) {
                $('#signatureStatus').textContent = '✅ در حال امضا';
                $('#signatureStatus').classList.add('signature-header__status--ok');
            }
        }
        function end() {
            if (!isDrawing) return;
            isDrawing = false;
            if (state.pointCount >= 15) {
                state.signatureImage = canvas.toDataURL('image/png');
                $('#signatureStatus').textContent = '✅ امضا ثبت شد';
                $('#signatureStatus').classList.add('signature-header__status--ok');
                $('#signatureWrap').classList.add('signature-wrap--active');
                updateStageUI();
            } else if (state.pointCount > 0) {
                $('#signatureStatus').textContent = '⚠️ امضا ناقص';
                state.signatureImage = null;
            }
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('mouseleave', end);
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', end);
    }

    // ===== OTP =====
    function setupOtp() {
        $$('.otp-input').forEach((input, idx, all) => {
            input.addEventListener('input', (e) => {
                const v = e.target.value.replace(/\D/g, '');
                e.target.value = v.slice(-1);
                if (v && idx < all.length - 1) all[idx + 1].focus();
                if (getOtpValue().length === 5) setTimeout(verifyOtp, 200);
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) all[idx - 1].focus();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const p = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 5);
                if (p.length === 5) {
                    p.split('').forEach((ch, i) => all[i].value = ch);
                    all[4].focus();
                    setTimeout(verifyOtp, 200);
                }
            });
        });
    }

    function getOtpValue() {
        return Array.from($$('.otp-input')).map(i => i.value).join('');
    }

    function resetOtpInputs() {
        $$('.otp-input').forEach(i => i.value = '');
        $$('.otp-input')[0]?.focus();
    }

    function sendOtp() {
        state.otpCode = OTP_CONFIG.mock ? OTP_CONFIG.mockCode :
            Math.floor(Math.random() * 90000 + 10000).toString();
        console.log(`🧪 [MOCK OTP Contract Sign] کد برای ${state.broker.mobile} → ${state.otpCode}`);
        $('#otpSection').style.display = 'block';
        resetOtpInputs();
        toast('کد تأیید ارسال شد (تست: 12345)', 'success');
    }

    function verifyOtp() {
        const entered = getOtpValue();
        const status = $('#otpStatus');
        status.className = 'otp-status';

        if (entered.length !== 5) {
            status.classList.add('otp-status--error');
            status.textContent = 'کد ۵ رقمی را کامل وارد کنید';
            return;
        }
        if (entered !== state.otpCode) {
            status.classList.add('otp-status--error');
            status.textContent = 'کد وارد شده صحیح نیست';
            resetOtpInputs();
            return;
        }
        state.otpVerified = true;
        status.classList.add('otp-status--success');
        status.textContent = '✅ تأیید شد';
        $$('.otp-input').forEach(i => { i.disabled = true; i.style.background = 'rgba(30,142,74,0.1)'; });
        $('#sendOtpBtn').disabled = true;
        $('#sendOtpBtn').textContent = '✅ تأیید شد';
        $('#sendOtpBtn').style.background = 'var(--success)';
        toast('✅ OTP تأیید شد', 'success');
        updateStageUI();
    }

    // ===== Submit =====
    function handleSubmit() {
        if (!state.signatureImage) { toast('ابتدا امضا کنید', 'error'); return; }
        if (!state.otpVerified) { toast('ابتدا OTP را تأیید کنید', 'error'); return; }
        if (!state.checklistDone) { toast('تمام بندها را تأیید کنید', 'error'); return; }

        const btn = $('#submitBtn');
        btn.classList.add('btn--loading'); btn.disabled = true;

        setTimeout(() => {
            try {
                if (!window.WamPayContracts) {
                    throw new Error('Contract service not available');
                }

                // امضای کارگزار
                const result = WamPayContracts.signByBroker(state.contract.id, {
                    image: state.signatureImage,
                    otpVerified: true,
                    ip: null,
                    ua: navigator.userAgent.slice(0, 100)
                });

                if (!result.ok) {
                    toast(result.error || 'خطا در ثبت امضا', 'error');
                    btn.classList.remove('btn--loading');
                    btn.disabled = false;
                    return;
                }

                // به‌روزرسانی وضعیت پرونده
                const cases = JSON.parse(localStorage.getItem('wamPayApplications') || '[]');
                const idx = cases.findIndex(c => c.id === state.contract.caseId);
                if (idx >= 0) {
                    cases[idx].status = 'awaiting_site_sign';
                    if (cases[idx].contracts?.purchase) {
                        cases[idx].contracts.purchase.status = 'broker_signed';
                        cases[idx].contracts.purchase.signedAt = new Date().toISOString();
                    }
                    cases[idx].updatedAt = new Date().toISOString();
                    localStorage.setItem('wamPayApplications', JSON.stringify(cases));
                }

                // اضافه به صف امضای سایت (مدیر کل + حقوقی)
                const siteQueue = JSON.parse(localStorage.getItem('wamPaySiteSignQueue') || '[]');
                siteQueue.push({
                    contractId: state.contract.id,
                    contractNumber: state.contract.contractNumber,
                    contractType: 'purchase',
                    caseId: state.contract.caseId,
                    caseNumber: state.contract.caseNumber,
                    brokerId: state.contract.brokerId,
                    brokerName: state.broker.name,
                    invoiceId: state.contract.invoiceId,
                    invoiceNumber: state.contract.invoiceNumber,
                    brokerSignedAt: new Date().toISOString(),
                    brokerSignatureImage: state.signatureImage,
                    status: 'awaiting_site_sign',
                    submittedAt: new Date().toISOString()
                });
                localStorage.setItem('wamPaySiteSignQueue', JSON.stringify(siteQueue));

                // لاگ مالی
                if (window.WamPayFinancialLog) {
                    WamPayFinancialLog.logContractSigned(
                        result.contract,
                        state.broker,
                        'broker'
                    );
                }

                // نمایش موفقیت
                renderSuccess();

                console.log('✅ [BrokerContractSign] امضای کارگزار ثبت شد:', state.contract.contractNumber);

            } catch (err) {
                console.error('❌ خطا:', err);
                toast('خطا در ثبت امضا', 'error');
                btn.classList.remove('btn--loading');
                btn.disabled = false;
            }
        }, 900);
    }

                        <span style="font-family:monospace;">${c.contractNumber}</span>
                    </div>
                    <div class="success-box__row">
                        <span>📁 شماره پرونده</span>
                        <span style="font-family:monospace;">${c.caseNumber || '—'}</span>
                    </div>
                    <div class="success-box__row">
                        <span>💰 سهم شما</span>
                        <span style="color:var(--success);">${faPrice(purchaseTotal)} تومان</span>
                    </div>
                    <div class="success-box__row">
                        <span>📊 وضعیت</span>
                        <span style="color:var(--warning);">⏳ در انتظار تأیید سایت</span>
                    </div>
                </div>

                <div class="sign-actions">
                    <a href="broker-dashboard.html" class="btn btn--primary" style="text-decoration:none;">
                        <span>🏠 بازگشت به داشبورد</span>
                    </a>
                </div>
            </div>
        `;
    }

    // ===== Events =====
    function attachEvents() {
        // Signature
        initSignature();
        $('#clearSignature')?.addEventListener('click', () => {
            const c = $('#signatureCanvas');
            if (!c || !canvasCtx) return;
            canvasCtx.clearRect(0, 0, c.width, c.height);
            state.signatureImage = null;
            state.pointCount = 0;
            $('#signatureStatus').textContent = 'امضا نشده';
            $('#signatureStatus').classList.remove('signature-header__status--ok');
            $('#signatureWrap').classList.remove('signature-wrap--active');
            updateStageUI();
        });

        // OTP
        setupOtp();
        $('#sendOtpBtn')?.addEventListener('click', sendOtp);

        // Submit
        $('#submitBtn')?.addEventListener('click', handleSubmit);

        // Scroll
        setupScrollDetection();

        // Checklist
        setupChecklist();
    }

    // ===== Theme =====
    function initTheme() {
        const saved = localStorage.getItem('wamPayTheme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        const btn = $('#themeBtn');
        if (!btn) return;
        btn.textContent = saved === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('wamPayTheme', 'light');
                btn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('wamPayTheme', 'dark');
                btn.textContent = '☀️';
            }
        });
    }

    // ===== Init =====
    function init() {
        if (!checkAuth()) return;
        if (!loadContract()) return;
        renderPage();
        initTheme();

        console.log('%c✍️ WAM PAY — Broker Contract Sign v1.0', 'color:#0b3b23;font-weight:bold;font-size:14px;');
        console.log('%c👤 کارگزار:', 'color:#d4a62a;', state.broker.name);
        console.log('%c📄 قرارداد:', 'color:#d4a62a;', state.contract.contractNumber);
        console.log('%c🧪 Mock OTP: 12345', 'color:#d4a62a;font-weight:bold;');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
</body>
</html>
