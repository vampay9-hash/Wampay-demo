<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3b23">
<title>تأیید کد | وام پی</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--primary:#0b3b23;--gold:#d4a62a;--muted:#77847b;--bg:#f4f7f4;--card:#fff;--text:#1a2b22;--error:#c0392b;--success:#1e8e4a}
[data-theme="dark"]{--bg:#0d1712;--card:#142219;--text:#e8f1ea;--muted:#8aa093}
*{box-sizing:border-box}
body{margin:0;font-family:'Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-wrap{width:100%;max-width:420px}
.auth-card{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(11,59,35,.08);padding:28px 22px;border:1px solid rgba(11,59,35,.06)}
.brand{text-align:center;margin-bottom:18px}
.brand-logo{font-size:30px;font-weight:800;color:var(--primary);letter-spacing:1px}
.brand-logo span{color:var(--gold)}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}
.form-title{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--primary);text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 18px;line-height:1.8}
.sub strong{color:var(--text);direction:ltr;unicode-bidi:embed;display:inline-block}
.otp-boxes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:16px 0 14px}
.otp-box{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid rgba(11,59,35,.18);border-radius:12px;background:transparent;color:var(--text);font-family:inherit;transition:border-color .2s,box-shadow .2s,transform .1s}
.otp-box:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(11,59,35,.1);transform:translateY(-2px)}
.otp-box:disabled{opacity:.5}
.otp-box.filled{border-color:var(--primary);background:rgba(11,59,35,.04)}
.timer-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:16px;padding:0 4px}
.link-btn{background:none;border:none;color:var(--primary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .2s}
.link-btn:hover:not(:disabled){background:rgba(11,59,35,.08)}
.link-btn:disabled{color:var(--muted);cursor:not-allowed;opacity:.6}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .2s,background .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#0a3220}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.message{padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:12px;line-height:1.7}
.message.error{background:rgba(192,57,43,.1);color:var(--error);border:1px solid rgba(192,57,43,.2)}
.message.success{background:rgba(30,142,74,.1);color:var(--success);border:1px solid rgba(30,142,74,.2)}
.forgot{display:block;text-align:center;font-size:13px;color:var(--primary);text-decoration:none;margin-top:14px}
.forgot:hover{text-decoration:underline}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">وام<span>پی</span></div>
      <div class="brand-sub">تأیید شماره موبایل</div>
    </div>

    <h2 class="form-title">کد تأیید را وارد کنید</h2>
    <p class="sub">
      کد <span id="lenLabel">۵</span> رقمی به شماره
      <strong id="mobileMasked">—</strong>
      ارسال شد.
    </p>

    <div id="otpMessage" class="message hidden"></div>

    <div class="otp-boxes" id="otpBoxes">
      <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" data-idx="0" autocomplete="one-time-code">
      <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" data-idx="1">
      <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" data-idx="2">
      <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" data-idx="3">
      <input type="tel" inputmode="numeric" maxlength="1" class="otp-box" data-idx="4">
    </div>

    <div class="timer-row">
      <span>زمان باقی‌مانده: <strong id="timerText">۲:۰۰</strong></span>
      <button type="button" class="link-btn" id="resendBtn" disabled>ارسال مجدد</button>
    </div>

    <button type="button" class="btn btn-primary" id="verifyBtn" disabled>تأیید و ورود</button>

    <a class="forgot" href="login.html">ویرایش شماره موبایل</a>
  </div>
</div>

<script src="js/permissions.js"></script>
<script src="js/otp-service.js"></script>
<script src="js/verify-otp.js"></script>
</body>
</html>
