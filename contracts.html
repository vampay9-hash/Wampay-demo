<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b3b23">
  <meta name="description" content="قراردادها — وام پی">
  <meta name="robots" content="noindex, nofollow">
  <title>قراردادها | وام پی</title>

  <link rel="stylesheet"
        href="css/fonts/Vazirmatn-font-face.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">

  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b3b23'/><text y='72' x='50' text-anchor='middle' font-size='58' fill='%23d4a62a' font-family='sans-serif' font-weight='bold'>و</text></svg>">

  <style>
    /* ═══════════════════════════════════════
       SHARED CONTRACTS
       ═══════════════════════════════════════ */

    .wam-cont {
      min-height: 100vh;
      background: var(--wam-bg);
      padding-bottom: 100px;
    }

    .wam-cont__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--wam-space-md);
      padding: 12px var(--wam-space-lg);
      background: var(--wam-bg-alt);
      border-bottom: 1px solid var(--wam-border);
      position: sticky;
      top: 0;
      z-index: var(--wam-z-sticky);
      box-shadow: var(--wam-shadow-sm);
    }

    .wam-cont__topbar-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .wam-cont__topbar-back {
      color: var(--wam-text-muted);
      text-decoration: none;
      font-size: 0.75rem;
    }
    .wam-cont__topbar-back:hover { color: var(--wam-primary-light); }

    .wam-cont__topbar-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--wam-primary);
      margin: 0;
    }

    .wam-cont__topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wam-cont__icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--wam-bg-muted);
      color: var(--wam-text);
      border: 0;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--wam-t);
      font-family: inherit;
    }
    .wam-cont__icon-btn:hover {
      background: var(--wam-primary-soft);
      color: var(--wam-primary);
    }
    .wam-cont__icon-btn--primary {
      background: var(--wam-primary-light);
      color: #fff;
    }
    .wam-cont__icon-btn--primary:hover {
      background: var(--wam-primary);
    }

    .wam-cont__main {
      padding: var(--wam-space-lg);
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* Stats */
    .wam-cont__stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: var(--wam-space-md);
    }

    .wam-cont__stat {
      padding: 12px 10px;
      background: var(--wam-bg-alt);
      border: 1px solid var(--wam-border-soft);
      border-radius: var(--wam-radius);
      text-align: center;
      box-shadow: var(--wam-shadow-sm);
      cursor: pointer;
      transition: all var(--wam-t);
      font-family: inherit;
      color: var(--wam-text);
    }

    .wam-cont__stat:hover {
      box-shadow: var(--wam-shadow-md);
      transform: translateY(-2px);
      border-color: var(--wam-primary-light);
    }

    .wam-cont__stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--wam-primary);
      line-height: 1.1;
    }
    .wam-cont__stat-value--warning { color: var(--wam-warning-text); }
    .wam-cont__stat-value--success { color: var(--wam-success-text); }
    .wam-cont__stat-value--danger  { color: var(--wam-danger-text); }
    .wam-cont__stat-value--info    { color: var(--wam-info-text); }
    .wam-cont__stat-value--gold    { color: #7a5a00; }

    .wam-cont__stat-label {
      font-size: 0.68rem;
      color: var(--wam-text-muted);
      margin-top: 4px;
    }

    /* Search */
    .wam-cont__search {
      position: relative;
      margin-bottom: var(--wam-space-md);
    }

    .wam-cont__search input {
      width: 100%;
      padding: 11px 42px 11px 42px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--wam-text);
      background: var(--wam-bg-alt);
      border: 1.5px solid var(--wam-border);
      border-radius: var(--wam-radius);
      transition: border-color var(--wam-t), box-shadow var(--wam-t);
    }

    .wam-cont__search input:focus {
      outline: none;
      border-color: var(--wam-primary-light);
      box-shadow: 0 0 0 3px rgba(16, 91, 53, 0.13);
    }

    .wam-cont__search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--wam-text-muted);
      pointer-events: none;
    }

    .wam-cont__search-clear {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--wam-text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }
    .wam-cont__search-clear.is-visible { display: inline-flex; }

    /* Tabs */
    .wam-cont__tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-bottom: var(--wam-space-md);
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .wam-cont__tabs::-webkit-scrollbar { display: none; }

    .wam-cont__tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: var(--wam-radius-pill);
      background: var(--wam-bg-alt);
      border: 1px solid var(--wam-border);
      color: var(--wam-text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--wam-t);
      font-family: inherit;
      white-space: nowrap;
    }

    .wam-cont__tab:hover {
      border-color: var(--wam-primary-light);
      color: var(--wam-primary-light);
    }

    .wam-cont__tab.is-active {
      background: var(--wam-primary-light);
      color: #fff;
      border-color: var(--wam-primary-light);
    }

    .wam-cont__tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--wam-bg-muted);
      color: var(--wam-text-muted);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .wam-cont__tab.is-active .wam-cont__tab-count {
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    /* Sort */
    .wam-cont__sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      color: var(--wam-text-muted);
    }

    .wam-cont__sort-select {
      padding: 5px 10px;
      border-radius: var(--wam-radius-sm);
      border: 1px solid var(--wam-border);
      background: var(--wam-bg-alt);
      font-size: 0.75rem;
      font-family: inherit;
      color: var(--wam-text);
      cursor: pointer;
    }

    /* Grid */
    .wam-cont__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--wam-space-md);
    }

    /* Card */
    .wam-cont__card {
      background: var(--wam-bg-alt);
      border: 1px solid var(--wam-border-soft);
      border-right: 4px solid var(--wam-muted);
      border-radius: var(--wam-radius-md);
      padding: var(--wam-space-md);
      box-shadow: var(--wam-shadow-sm);
      cursor: pointer;
      transition: all var(--wam-t);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wam-cont__card:hover {
      box-shadow: var(--wam-shadow-md);
      transform: translateY(-2px);
    }

    .wam-cont__card--draft      { border-right-color: var(--wam-muted); }
    .wam-cont__card--pending    { border-right-color: var(--wam-warning); }
    .wam-cont__card--sent       { border-right-color: var(--wam-info); }
    .wam-cont__card--signed     { border-right-color: var(--wam-success); }
    .wam-cont__card--active     { border-right-color: var(--wam-primary-light); }
    .wam-cont__card--completed  { border-right-color: var(--wam-success); }
    .wam-cont__card--cancelled  { border-right-color: var(--wam-danger); }

    .wam-cont__card-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .wam-cont__card-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--wam-radius);
      background: var(--wam-primary-soft);
      color: var(--wam-primary);
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .wam-cont__card-title-wrap {
      flex: 1 1 auto;
      min-width: 0;
    }

    .wam-cont__card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--wam-text);
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wam-cont__card-id {
      font-size: 0.7rem;
      color: var(--wam-text-muted);
      font-family: 'Menlo', monospace;
      direction: ltr;
      text-align: right;
    }

    .wam-cont__card-amount {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--wam-primary);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .wam-cont__card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 0.75rem;
      color: var(--wam-text-muted);
    }

    .wam-cont__card-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Signature progress */
    .wam-cont__signatures {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      background: var(--wam-bg-muted);
      border-radius: var(--wam-radius);
    }

    .wam-cont__signatures-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--wam-text);
    }

    .wam-cont__signatures-num {
      font-size: 0.82rem;
      color: var(--wam-primary);
      font-weight: 800;
    }

    .wam-cont__signatures-bar {
      height: 6px;
      background: var(--wam-bg-alt);
      border-radius: var(--wam-radius-pill);
      overflow: hidden;
    }

    .wam-cont__signatures-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--wam-primary-light), var(--wam-gold));
      border-radius: var(--wam-radius-pill);
      transition: width var(--wam-t);
    }

    .wam-cont__signatures-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .wam-cont__sig-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: var(--wam-radius-pill);
      font-size: 0.66rem;
      font-weight: 700;
      background: var(--wam-bg-alt);
      color: var(--wam-text-muted);
      border: 1px solid var(--wam-border);
    }

    .wam-cont__sig-chip--signed {
      background: var(--wam-success-soft);
      color: var(--wam-success-text);
      border-color: transparent;
    }

    /* Card footer */
    .wam-cont__card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--wam-border-soft);
      margin-top: auto;
    }

    .wam-cont__card-date {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.7rem;
      color: var(--wam-text-muted);
    }

    .wam-cont__card-date-value {
      font-weight: 700;
      color: var(--wam-text);
      font-size: 0.8rem;
    }

    .wam-cont__status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--wam-radius-pill);
      font-size: 0.68rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .wam-cont__status-badge--draft      { background: var(--wam-muted-soft); color: var(--wam-text-muted); }
    .wam-cont__status-badge--pending    { background: var(--wam-warning-soft); color: var(--wam-warning-text); }
    .wam-cont__status-badge--sent       { background: var(--wam-info-soft); color: var(--wam-info-text); }
    .wam-cont__status-badge--signed     { background: var(--wam-success-soft); color: var(--wam-success-text); }
    .wam-cont__status-badge--active     { background: var(--wam-primary-soft); color: var(--wam-primary); }
    .wam-cont__status-badge--completed  { background: var(--wam-success-soft); color: var(--wam-success-text); }
    .wam-cont__status-badge--cancelled  { background: var(--wam-danger-soft); color: var(--wam-danger-text); }

    /* Empty */
    .wam-cont__empty {
      text-align: center;
      padding: 56px 20px;
      background: var(--wam-bg-alt);
      border: 1px dashed var(--wam-border);
      border-radius: var(--wam-radius-md);
    }

    .wam-cont__empty-icon {
      font-size: 2.6rem;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .wam-cont__empty-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--wam-text);
      margin: 0 0 6px;
    }

    .wam-cont__empty-text {
      font-size: 0.85rem;
      color: var(--wam-text-muted);
      margin: 0 0 var(--wam-space-md);
      line-height: 1.7;
    }

    /* Pagination */
    .wam-cont__pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: var(--wam-space-lg);
      flex-wrap: wrap;
    }

    .wam-cont__page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: var(--wam-radius-sm);
      border: 1px solid var(--wam-border);
      background: var(--wam-bg-alt);
      color: var(--wam-text);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--wam-t);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .wam-cont__page-btn:hover:not(:disabled) {
      border-color: var(--wam-primary-light);
      color: var(--wam-primary);
    }

    .wam-cont__page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .wam-cont__page-info {
      font-size: 0.78rem;
      color: var(--wam-text-muted);
      margin: 0 var(--wam-space-sm);
    }

    /* Modal */
    .wam-cont__modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 59, 35, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: var(--wam-z-modal);
      padding: 0;
    }
    .wam-cont__modal.is-open { display: flex; }

    .wam-cont__modal-box {
      background: var(--wam-bg-alt);
      width: 100%;
      max-width: 560px;
      border-radius: var(--wam-radius-lg) var(--wam-radius-lg) 0 0;
      padding: var(--wam-space-lg);
      padding-bottom: calc(var(--wam-space-lg) + env(safe-area-inset-bottom, 0px));
      animation: wam-slide-up 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .wam-cont__modal-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: var(--wam-space-md);
      border-bottom: 1px solid var(--wam-border-soft);
      margin-bottom: var(--wam-space-md);
    }

    .wam-cont__modal-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--wam-primary);
      flex: 1 1 auto;
    }

    .wam-cont__modal-close {
      background: transparent;
      border: 0;
      font-size: 1.2rem;
      color: var(--wam-text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .wam-cont__modal-close:hover {
      background: var(--wam-bg-muted);
      color: var(--wam-text);
    }

    .wam-cont__modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .wam-cont__modal-actions .wam-btn {
      flex: 1 1 0;
    }

    /* Detail rows */
    .wam-cont__detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      font-size: 0.85rem;
      border-bottom: 1px dashed var(--wam-border-soft);
    }
    .wam-cont__detail-row:last-child { border-bottom: 0; }

    .wam-cont__detail-label {
      color: var(--wam-text-muted);
      font-weight: 600;
      flex: 0 0 auto;
    }

    .wam-cont__detail-value {
      color: var(--wam-text);
      font-weight: 700;
      text-align: left;
      word-break: break-word;
      flex: 1 1 auto;
    }

    /* Detail sections */
    .wam-cont__section-box {
      margin-bottom: var(--wam-space-md);
      padding: var(--wam-space-md);
      background: var(--wam-bg-muted);
      border-radius: var(--wam-radius);
    }

    .wam-cont__section-box-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--wam-primary);
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Signature box */
    .wam-cont__sign-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 2px dashed var(--wam-border);
      border-radius: var(--wam-radius);
      cursor: pointer;
      transition: all var(--wam-t);
      margin-bottom: 8px;
    }

    .wam-cont__sign-box:hover {
      border-color: var(--wam-primary-light);
      background: var(--wam-primary-soft);
    }

    .wam-cont__sign-box.is-signed {
      border-style: solid;
      border-color: var(--wam-success);
      background: var(--wam-success-soft);
      cursor: default;
    }

    .wam-cont__sign-box-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--wam-bg-alt);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex: 0 0 auto;
    }

    .wam-cont__sign-box.is-signed .wam-cont__sign-box-icon {
      background: var(--wam-success);
      color: #fff;
    }

    .wam-cont__sign-box-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .wam-cont__sign-box-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--wam-text);
      margin: 0 0 2px;
    }

    .wam-cont__sign-box-role {
      font-size: 0.72rem;
      color: var(--wam-text-muted);
    }

    .wam-cont__sign-box-date {
      font-size: 0.7rem;
      color: var(--wam-success-text);
      font-weight: 700;
    }

    /* Toast */
    .wam-cont__toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--wam-primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--wam-radius-pill);
      font-size: 0.82rem;
      font-weight: 700;
      z-index: 1200;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .wam-cont__toast.is-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 640px) {
      .wam-cont__main { padding: var(--wam-space-md); }
      .wam-cont__grid { grid-template-columns: 1fr; }
      .wam-cont__stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .wam-cont__stat { padding: 10px 6px; }
      .wam-cont__stat-value { font-size: 1.05rem; }
      .wam-cont__stat-label { font-size: 0.6rem; }
    }
  </style>
</head>

<body data-page="contracts">

  <div class="wam-cont" id="contRoot">

    <!-- ═══ TOPBAR ═══ -->
    <header class="wam-cont__topbar">
      <div class="wam-cont__topbar-info">
        <a href="#" class="wam-cont__topbar-back" id="backLink">↩ بازگشت</a>
        <h1 class="wam-cont__topbar-title">📝 قراردادها</h1>
      </div>
      <div class="wam-cont__topbar-actions">

    <!-- ═══ MODAL: جزئیات قرارداد ═══ -->
    <div class="wam-cont__modal" id="detailModal" role="dialog" aria-modal="true">

        <div class="wam-cont__modal-head">
          <h3 class="wam-cont__modal-title" id="detailModalTitle">📝 جزئیات قرارداد</h3>
          <button type="button" class="wam-cont__modal-close" id="detailModalClose" aria-label="بستن">✕</button>
        </div>

        <div id="detailBody">
          <!-- توسط JS پر می‌شود -->
        </div>

        <div class="wam-cont__modal-actions">
          <button type="button" class="wam-btn" id="detailCloseBtn">بستن</button>

  <!-- ═══ Scripts ═══ -->
  <script src="js/bundle-common.js" defer></script>
  <script src="js/bundle-state.js" defer></script>

  <script>
    /* ────────────────────────────────────────
       CONTRACTS CONTROLLER (Shared)
       - لیست قراردادها با فیلتر وضعیت
       - مشاهده جزئیات + امضای نقش‌محور
       - ذخیره در wamPayContracts
       ──────────────────────────────────────── */
    (function () {
      'use strict';

      var $ = function (id) { return document.getElementById(id); };
      var $$ = function (sel) { return document.querySelectorAll(sel); };

      var STORAGE_CONTRACTS = 'wamPayContracts';
      var STORAGE_CASES = 'wamPayCases';
      var PAGE_SIZE = 12;

      var state = {
        user: null,
        all: [],
        filtered: [],
        status: 'all',
        query: '',
        sort: 'newest',
        page: 1,
        currentId: null
      };

      // نقش‌های امضاکننده
      var SIGNER_ROLES = [
        { key: 'applicant', label: 'متقاضی', icon: '👤' },
        { key: 'broker',    label: 'کارگزار', icon: '💼' },
        { key: 'verifier',  label: 'اعتبارسنج', icon: '🔍' },
        { key: 'admin',     label: 'مدیر', icon: '⚙️' }
      ];

      // ═══════════════════════════════════
      // ابزارها
      // ═══════════════════════════════════

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function toFa(n) {
        if (n == null) return '۰';
        try { return Number(n).toLocaleString('fa-IR'); }
        catch (_) { return String(n); }
      }

      function fmtAmount(n) {
        if (n == null || isNaN(n)) return '۰';
        return toFa(Math.round(Number(n)));
      }

      function fmtDate(ts) {
        if (!ts) return '—';
        try {
          if (window.WamPersianDate && typeof window.WamPersianDate.format === 'function') {
            return window.WamPersianDate.format(new Date(ts));
          }
        } catch (_) {}
        try { return new Date(ts).toLocaleDateString('fa-IR'); } catch (_) { return '—'; }
      }

      function relTime(ts) {
        if (!ts) return '';
        var diff = Date.now() - ts;
        var abs = Math.abs(diff);
        if (abs < 3600000) return Math.round(abs / 60000) + ' دقیقه پیش';
        if (abs < 86400000) return Math.round(abs / 3600000) + ' ساعت پیش';
        return Math.round(abs / 86400000) + ' روز پیش';
      }

      function readJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch (_) { return fallback; }
      }

      function writeJSON(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); return true; }
        catch (_) { return false; }
      }

      function currentUser() {
        return readJSON('wamPayCurrentUser', null) ||
               { name: 'کاربر', username: 'user', role: 'applicant', id: 'user' };
      }

      function currentUserId() {
        var u = state.user;
        return (u && (u.id || u.username)) || 'user';
      }

      function roleOf() {
        var u = state.user;
        return (u && (u.role || u.userRole)) || 'applicant';
      }

      function canSeeAll() {
        var r = roleOf();
        return r === 'super_admin' || r === 'admin' || r === 'verifier' || r === 'broker';
      }

      function emitEvent(name, payload) {
        try {
          if (window.EventBus && typeof window.EventBus.emit === 'function') {
            window.EventBus.emit(name, payload);
          }
        } catch (_) {}
      }

      function uid() {
        return 'CT-' + Date.now().toString(36).toUpperCase().slice(-5) +
               Math.random().toString(36).slice(2, 4).toUpperCase();
      }

      function statusLabel(s) {
        var map = {
          draft: 'پیش‌نویس', pending: 'در انتظار', sent: 'ارسال‌شده',
          signed: 'امضاشده', active: 'فعال', completed: 'تکمیل‌شده',
          cancelled: 'لغو‌شده'
        };
        return map[s] || s || '—';
      }

      function typeLabel(t) {
        var map = {
          loan: '💰 قرارداد وام',
          guarantee: '🛡️ قرارداد ضمانت',
          service: '📋 قرارداد خدمات',
          nda: '🔒 محرمانگی'
        };
        return map[t] || '📝 قرارداد';
      }

      function showToast(msg) {
        var t = $('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('is-visible');
        setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
      }

      // ═══════════════════════════════════
      // بارگذاری
      // ═══════════════════════════════════

      function loadContracts() {
        var all = readJSON(STORAGE_CONTRACTS, []);
        if (!Array.isArray(all)) return [];

        if (canSeeAll()) return all;

        var me = currentUserId();
        var myName = (state.user && state.user.name) || '';
        var myRole = roleOf();

        return all.filter(function (c) {
          if (!c) return false;
          return c.applicantId === me ||
                 (c.applicantName && myName && c.applicantName === myName) ||
                 c.brokerId === me ||
                 (c.brokerName && myName && c.brokerName === myName);
        });
      }

      function seedIfEmpty() {
        var all = readJSON(STORAGE_CONTRACTS, []);
        if (Array.isArray(all) && all.length > 0) return;

        var now = Date.now();
        var me = currentUserId();
        var meName = (state.user && state.user.name) || 'کاربر';

        var samples = [
          {
            id: 'CT-' + now.toString(36).toUpperCase().slice(-5) + 'A',
            type: 'loan',
            title: 'قرارداد وام مسکن ۵۰۰ میلیونی',
            applicantId: me, applicantName: meName,
            brokerId: null, brokerName: 'حسن کریمی',
            caseId: 'C-ABC12',
            amount: 500,
            term: 60,
            rate: 18,
            status: 'pending',
            signatures: {
              applicant: null,
              broker: { at: now - 86400000 * 2, by: 'حسن کریمی' },
              verifier: null,
              admin: null
            },
            createdAt: now - 86400000 * 3,
            updatedAt: now - 86400000 * 2
          },
          {
            id: 'CT-' + now.toString(36).toUpperCase().slice(-5) + 'B',
            type: 'loan',
            title: 'قرارداد وام خودرو ۲۰۰ میلیونی',
            applicantId: me, applicantName: meName,
            brokerId: null, brokerName: 'زهرا نوری',
            caseId: 'C-DEF34',
            amount: 200,
            term: 36,
            rate: 16,
            status: 'signed',
            signatures: {
              applicant: { at: now - 86400000 * 5, by: meName },
              broker: { at: now - 86400000 * 6, by: 'زهرا نوری' },
              verifier: { at: now - 86400000 * 5, by: 'اعتبارسنج' },
              admin: null
            },
            createdAt: now - 86400000 * 7,
            updatedAt: now - 86400000 * 5
          },
          {
            id: 'CT-' + now.toString(36).toUpperCase().slice(-5) + 'C',
            type: 'loan',
            title: 'قرارداد وام شخصی ۸۰ میلیونی',
            applicantId: me, applicantName: meName,
            brokerId: null, brokerName: 'حسن کریمی',
            caseId: 'C-GHI56',
            amount: 80,
            term: 24,
            rate: 20,
            status: 'active',
            signatures: {
              applicant: { at: now - 86400000 * 20, by: meName },
              broker: { at: now - 86400000 * 21, by: 'حسن کریمی' },
              verifier: { at: now - 86400000 * 20, by: 'اعتبارسنج' },
              admin: { at: now - 86400000 * 19, by: 'مدیر' }
            },
            createdAt: now - 86400000 * 22,
            updatedAt: now - 86400000 * 19
          }
        ];

        if (!Array.isArray(all)) all = [];
        all = all.concat(samples);
        writeJSON(STORAGE_CONTRACTS, all);
      }

      // ═══════════════════════════════════
      // آمار
      // ═══════════════════════════════════

      function updateStats() {
        var counts = {
          total: state.all.length,
          draft: 0, pending: 0, sent: 0, signed: 0,
          active: 0, completed: 0, cancelled: 0
        };

        state.all.forEach(function (c) {
          var st = c.status || 'draft';
          if (counts[st] != null) counts[st]++;
        });

        if ($('statTotal')) $('statTotal').textContent = toFa(counts.total);
        if ($('statPending')) $('statPending').textContent = toFa(counts.pending);
        if ($('statSent')) $('statSent').textContent = toFa(counts.sent);
        if ($('statSigned')) $('statSigned').textContent = toFa(counts.signed);
        if ($('statActive')) $('statActive').textContent = toFa(counts.active);

        Object.keys(counts).forEach(function (k) {
          var el = document.querySelector('[data-count="' + k + '"]');
          if (el) el.textContent = toFa(counts[k]);
        });
      }

      function countSignatures(c) {
        if (!c || !c.signatures) return 0;
        var n = 0;
        Object.keys(c.signatures).forEach(function (k) {
          if (c.signatures[k]) n++;
        });
        return n;
      }

      // ═══════════════════════════════════
      // فیلتر و مرتب
      // ═══════════════════════════════════

      function applyFilters() {
        var q = state.query.toLowerCase();
        var st = state.status;

        state.filtered = state.all.filter(function (c) {
          if (st !== 'all' && (c.status || 'draft') !== st) return false;
          if (q) {
            var hay = [
              c.title, c.id, c.applicantName, c.brokerName, c.caseId
            ].join(' ').toLowerCase();
            if (hay.indexOf(q) < 0) return false;
          }
          return true;
        });

        var s = state.sort;
        state.filtered.sort(function (a, b) {
          if (s === 'oldest') return (a.createdAt || 0) - (b.createdAt || 0);
          if (s === 'amount_high') return (Number(b.amount) || 0) - (Number(a.amount) || 0);
          if (s === 'amount_low') return (Number(a.amount) || 0) - (Number(b.amount) || 0);
          if (s === 'signatures') return countSignatures(b) - countSignatures(a);
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

        state.page = 1;
        render();
      }

      // ═══════════════════════════════════
      // رندر
      // ═══════════════════════════════════

      function render() {
        var grid = $('contGrid');
        var empty = $('emptyState');
        var pagination = $('pagination');
        var countEl = $('resultsCount');

        if (countEl) countEl.textContent = toFa(state.filtered.length) + ' قرارداد';

        if (state.filtered.length === 0) {
          if (grid) grid.innerHTML = '';
          if (empty) {
            empty.style.display = '';
            var et = $('emptyTitle');
            var ex = $('emptyText');
            if (state.query || state.status !== 'all') {
              if (et) et.textContent = 'نتیجه‌ای یافت نشد';
              if (ex) ex.textContent = 'با فیلترهای فعلی قراردادی وجود ندارد.';
            } else {
              if (et) et.textContent = 'هنوز قراردادی ندارید';
              if (ex) ex.textContent = 'پس از تأیید پرونده‌ها، قراردادها اینجا نمایش داده می‌شوند.';
            }
          }
          if (pagination) pagination.style.display = 'none';
          return;
        }

        if (empty) empty.style.display = 'none';

        var totalPages = Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages;
        var start = (state.page - 1) * PAGE_SIZE;
        var slice = state.filtered.slice(start, start + PAGE_SIZE);

        var html = '';
        slice.forEach(function (c) {
          html += renderCard(c);
        });
        if (grid) grid.innerHTML = html;

        // Bind card click
        grid.querySelectorAll('.wam-cont__card').forEach(function (card) {
          card.addEventListener('click', function () {
            var id = card.getAttribute('data-id');
            if (id) openDetail(id);
          });
        });

        if (pagination) pagination.style.display = '';
        if ($('pageInfo')) $('pageInfo').textContent = toFa(state.page) + ' از ' + toFa(totalPages);
        if ($('prevPage')) $('prevPage').disabled = state.page <= 1;
        if ($('nextPage')) $('nextPage').disabled = state.page >= totalPages;
      }

      function renderCard(c) {
        var st = c.status || 'draft';
        var totalSigs = SIGNER_ROLES.length;
        var signedCount = countSignatures(c);
        var progress = Math.round((signedCount / totalSigs) * 100);

        var sigsChips = '';
        SIGNER_ROLES.forEach(function (role) {
          var sig = c.signatures && c.signatures[role.key];
          var cls = 'wam-cont__sig-chip' + (sig ? ' wam-cont__sig-chip--signed' : '');
          sigsChips += '<span class="' + cls + '">' + (sig ? '✓' : '○') + ' ' + role.label + '</span>';
        });

        return '' +
          '<div class="wam-cont__card wam-cont__card--' + esc(st) + '" data-id="' + esc(c.id) + '">' +
            '<div class="wam-cont__card-head">' +
              '<div class="wam-cont__card-icon">📝</div>' +
              '<div class="wam-cont__card-title-wrap">' +
                '<p class="wam-cont__card-title">' + esc(c.title || 'قرارداد بدون عنوان') + '</p>' +
                '<div class="wam-cont__card-id">' + esc(c.id) + '</div>' +
              '</div>' +
              '<div class="wam-cont__card-amount">' + fmtAmount(c.amount) + '</div>' +
            '</div>' +

            '<div class="wam-cont__card-meta">' +
              '<span class="wam-cont__card-meta-item">' + typeLabel(c.type) + '</span>' +
              (c.applicantName ? '<span class="wam-cont__card-meta-item">👤 ' + esc(c.applicantName) + '</span>' : '') +
              (c.caseId ? '<span class="wam-cont__card-meta-item">📁 ' + esc(c.caseId) + '</span>' : '') +
            '</div>' +

            '<div class="wam-cont__signatures">' +
              '<div class="wam-cont__signatures-head">' +
                '<span>امضاها</span>' +
                '<span class="wam-cont__signatures-num">' + toFa(signedCount) + ' از ' + toFa(totalSigs) + '</span>' +
              '</div>' +
              '<div class="wam-cont__signatures-bar">' +
                '<div class="wam-cont__signatures-fill" style="width:' + progress + '%;"></div>' +
              '</div>' +
              '<div class="wam-cont__signatures-list">' + sigsChips + '</div>' +
            '</div>' +

            '<div class="wam-cont__card-footer">' +
              '<div class="wam-cont__card-date">' +
                '<span>تاریخ ثبت</span>' +
                '<span class="wam-cont__card-date-value">' + esc(fmtDate(c.createdAt)) + '</span>' +
              '</div>' +
              '<span class="wam-cont__status-badge wam-cont__status-badge--' + esc(st) + '">' +
                statusLabel(st) +
              '</span>' +
            '</div>' +
          '</div>';
      }

      // ═══════════════════════════════════
      // Modal جزئیات
      // ═══════════════════════════════════

      function openDetail(id) {
        var c = state.all.find(function (x) { return x.id === id; });
        if (!c) return;
        state.currentId = id;

        var body = $('detailBody');
        var title = $('detailModalTitle');
        if (title) title.textContent = '📝 ' + (c.title || 'قرارداد');

        var myRole = roleOf();
        var canSign = ['pending', 'sent', 'draft'].indexOf(c.status) >= 0 &&
                      SIGNER_ROLES.some(function (r) { return r.key === myRole; }) &&
                      c.signatures && !c.signatures[myRole];

        // بخش اطلاعات
        var infoHtml = '' +
          '<div class="wam-cont__section-box">' +
            '<h4 class="wam-cont__section-box-title">📋 اطلاعات قرارداد</h4>' +
            '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">شناسه:</span><span class="wam-cont__detail-value" dir="ltr">' + esc(c.id) + '</span></div>' +
            '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">نوع:</span><span class="wam-cont__detail-value">' + typeLabel(c.type) + '</span></div>' +
            '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">مبلغ:</span><span class="wam-cont__detail-value">' + fmtAmount(c.amount) + ' میلیون ریال</span></div>' +
            (c.term ? '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">مدت:</span><span class="wam-cont__detail-value">' + toFa(c.term) + ' ماه</span></div>' : '') +
            (c.rate ? '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">نرخ سود:</span><span class="wam-cont__detail-value">' + toFa(c.rate) + '٪</span></div>' : '') +
            (c.caseId ? '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">پرونده:</span><span class="wam-cont__detail-value" dir="ltr">' + esc(c.caseId) + '</span></div>' : '') +
          '</div>' +
          '<div class="wam-cont__section-box">' +
            '<h4 class="wam-cont__section-box-title">👥 طرفین قرارداد</h4>' +
            '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">متقاضی:</span><span class="wam-cont__detail-value">' + esc(c.applicantName || '—') + '</span></div>' +
            '<div class="wam-cont__detail-row"><span class="wam-cont__detail-label">کارگزار:</span><span class="wam-cont__detail-value">' + esc(c.brokerName || '—') + '</span></div>' +
          '</div>' +
          '<div class="wam-cont__section-box">' +
            '<h4 class="wam-cont__section-box-title">✍️ وضعیت امضاها</h4>' +
            renderSignaturesDetail(c) +
          '</div>';

        if (body) body.innerHTML = infoHtml;

        var actionBtn = $('detailActionBtn');
        if (actionBtn) {
          if (canSign) {
            actionBtn.style.display = '';
            actionBtn.textContent = '✍️ امضا با نقش ' + (SIGNER_ROLES.find(function (r) { return r.key === myRole; }) || {}).label;
            actionBtn.onclick = function () { signContract(id); };
          } else if (c.signatures && c.signatures[myRole]) {
            actionBtn.style.display = '';
            actionBtn.textContent = '✓ امضاشده';
            actionBtn.disabled = true;
            actionBtn.className = 'wam-btn';
          } else {
            actionBtn.style.display = 'none';
          }
        }

        var m = $('detailModal');
        if (m) m.classList.add('is-open');
      }

      function renderSignaturesDetail(c) {
        var html = '';
        SIGNER_ROLES.forEach(function (role) {
          var sig = c.signatures && c.signatures[role.key];
          var cls = 'wam-cont__sign-box' + (sig ? ' is-signed' : '');
          html += '' +
            '<div class="' + cls + '">' +
              '<div class="wam-cont__sign-box-icon">' + (sig ? '✓' : role.icon) + '</div>' +
              '<div class="wam-cont__sign-box-body">' +
                '<p class="wam-cont__sign-box-name">' + role.label + '</p>' +
                '<p class="wam-cont__sign-box-role">' + (sig ? (sig.by || '—') : 'در انتظار امضا') + '</p>' +
                (sig ? '<p class="wam-cont__sign-box-date">✓ امضاشده در ' + esc(fmtDate(sig.at)) + '</p>' : '') +
              '</div>' +
            '</div>';
        });
        return html;
      }

      function closeDetail() {
        var m = $('detailModal');
        if (m) m.classList.remove('is-open');
        state.currentId = null;
      }

      function signContract(id) {
        var c = state.all.find(function (x) { return x.id === id; });
        if (!c) return;

        var myRole = roleOf();
        if (!c.signatures) c.signatures = {};

        if (c.signatures[myRole]) {
          showToast('شما قبلاً امضا کرده‌اید.');
          return;
        }

        if (!confirm('آیا از امضای این قرارداد مطمئن هستید؟')) return;

        c.signatures[myRole] = {
          at: Date.now(),
          by: state.user.name || state.user.username || 'کاربر'
        };

        // بررسی وضعیت جدید
        var totalSigned = countSignatures(c);
        var totalRequired = SIGNER_ROLES.length;

        if (totalSigned >= totalRequired) {
          c.status = 'signed';
        } else if (c.status === 'draft' || c.status === 'pending') {
          c.status = 'sent';
        }

        c.updatedAt = Date.now();

        // Persist
        var all = readJSON(STORAGE_CONTRACTS, []);
        if (Array.isArray(all)) {
          for (var i = 0; i < all.length; i++) {
            if (all[i].id === id) {
              all[i] = c;
              break;
            }
          }
          writeJSON(STORAGE_CONTRACTS, all);
        }

        emitEvent('contract:signed', {
          id: id,
          role: myRole,
          totalSigned: totalSigned
        });

        state.all = loadContracts();
        updateStats();
        applyFilters();
        openDetail(id);
        showToast('✓ امضای شما ثبت شد');
      }

      // ═══════════════════════════════════
      // Export CSV
      // ═══════════════════════════════════

      function exportCSV() {
        var rows = [];
        rows.push(['ID', 'Title', 'Type', 'Applicant', 'Broker', 'Amount', 'Status', 'Signatures', 'CreatedAt']);
        state.filtered.forEach(function (c) {
          rows.push([
            c.id || '',
            (c.title || '').replace(/,/g, ' '),
            c.type || '',
            c.applicantName || '',
            c.brokerName || '',
            c.amount || 0,
            c.status || '',
            countSignatures(c) + '/' + SIGNER_ROLES.length,
            c.createdAt ? new Date(c.createdAt).toISOString().slice(0, 10) : ''
          ]);
        });
        var csv = '\uFEFF' + rows.map(function (r) { return r.join(','); }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'contracts-' + Date.now() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast('✓ خروجی CSV دانلود شد');
      }

      // ═══════════════════════════════════
      // رویدادها
      // ═══════════════════════════════════

      function bindEvents() {
        // Search
        var input = $('searchInput');
        var clearBtn = $('searchClear');
        if (input) {
          input.addEventListener('input', function () {
            state.query = input.value || '';
            if (clearBtn) clearBtn.classList.toggle('is-visible', state.query.length > 0);
            applyFilters();
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', function () {
            if (input) input.value = '';
            state.query = '';
            clearBtn.classList.remove('is-visible');
            applyFilters();
          });
        }

        // Stat boxes
        $$('.wam-cont__stat').forEach(function (stat) {
          stat.addEventListener('click', function () {
            var s = stat.getAttribute('data-status');
            if (!s) return;
            state.status = s === 'all' ? 'all' : s;
            $$('.wam-cont__tab').forEach(function (x) {
              x.classList.toggle('is-active', x.getAttribute('data-tab') === state.status);
            });
            applyFilters();
          });
        });

        // Tabs
        $$('.wam-cont__tab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            $$('.wam-cont__tab').forEach(function (x) { x.classList.remove('is-active'); });
            tab.classList.add('is-active');
            state.status = tab.getAttribute('data-tab') || 'all';
            applyFilters();
          });
        });

        // Sort
        var sortSelect = $('sortSelect');
        if (sortSelect) {
          sortSelect.addEventListener('change', function () {
            state.sort = sortSelect.value;
            applyFilters();
          });
        }

        // Refresh
        if ($('refreshBtn')) {
          $('refreshBtn').addEventListener('click', function () {
            state.all = loadContracts();
            updateStats();
            applyFilters();
            $('refreshBtn').textContent = '✓';
            setTimeout(function () { $('refreshBtn').textContent = '🔄'; }, 900);
          });
        }

        // Export
        if ($('exportBtn')) $('exportBtn').addEventListener('click', exportCSV);

        // Detail modal
        if ($('detailModalClose')) $('detailModalClose').addEventListener('click', closeDetail);
        if ($('detailCloseBtn')) $('detailCloseBtn').addEventListener('click', closeDetail);
        var dm = $('detailModal');
        if (dm) {
          dm.addEventListener('click', function (e) {
            if (e.target === dm) closeDetail();
          });
        }

        // Pagination
        if ($('prevPage')) $('prevPage').addEventListener('click', function () {
          if (state.page > 1) { state.page--; render(); try { window.scrollTo({top:0,behavior:'smooth'}); } catch(_){} }
        });
        if ($('nextPage')) $('nextPage').addEventListener('click', function () {
          var totalPages = Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE));
          if (state.page < totalPages) { state.page++; render(); try { window.scrollTo({top:0,behavior:'smooth'}); } catch(_){} }
        });

        // Back
        if ($('backLink')) {
          $('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'dashboard.html';
          });
        }

        // Esc
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeDetail();
        });
      }

      // ═══════════════════════════════════
      // راه‌اندازی
      // ═══════════════════════════════════

      function init() {
        state.user = currentUser();
        seedIfEmpty();
        state.all = loadContracts();
        updateStats();
        applyFilters();
        bindEvents();

        emitEvent('contracts:opened', {});

        // auto-refresh
        setInterval(function () {
          state.all = loadContracts();
          updateStats();
          applyFilters();
        }, 60000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      if (window.EventBus && typeof window.EventBus.on === 'function') {
        try {
          window.EventBus.on('auth:logout', function () {
            window.location.replace('login.html');
          });
        } catch (_) {}
      }

    })();
  </script>

</body>
</html>
