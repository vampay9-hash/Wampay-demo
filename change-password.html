<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغییر رمز عبور | وام پی</title>
<link href="css/fonts/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root {
    --primary: #0b3b23; --primary-light: #1a5c3a; --primary-dark: #062416;
    --gold: #d4a62a; --gold-light: #f0c651;
    --text: #1a2b22; --text-muted: #6b7d73;
    --bg: #f4f7f4; --bg-card: #ffffff; --border: #e0e8e3;
    --error: #c0392b; --success: #1e8e4a; --warning: #e67e22; --info: #2980b9;
    --shadow-sm: 0 2px 8px rgba(11,59,35,0.06);
    --shadow-md: 0 8px 24px rgba(11,59,35,0.10);
    --shadow-lg: 0 16px 48px rgba(11,59,35,0.18);
    --radius: 14px; --radius-sm: 8px;
    --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
    --text: #e8ede9; --text-muted: #8fa398;
    --bg: #0a1410; --bg-card: #10201a; --border: #1f3429;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.7;
    transition: background 0.3s, color 0.3s;
    background-image:
        radial-gradient(circle at 10% 10%, rgba(212,166,42,0.06), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(11,59,35,0.08), transparent 40%);
    display: flex; flex-direction: column;
}

/* Header */
.cp-header {
    background: linear-gradient(135deg, #062416 0%, #0b3b23 50%, #1a5c3a 100%);
    color: #fff; padding: 16px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    border-bottom: 3px solid var(--gold);
    position: sticky; top: 0; z-index: 100;
}
.cp-header__inner {
    max-width: 1100px; width: 100%; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.cp-logo {
    display: flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 20px; color: #fff; text-decoration: none;
}
.cp-logo__icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 24px rgba(212,166,42,0.6);
}
.cp-header__actions { display: flex; gap: 8px; align-items: center; }
.cp-theme-btn {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid rgba(212,166,42,0.3);
    background: rgba(255,255,255,0.08); color: var(--gold-light);
    cursor: pointer; font-size: 18px; transition: var(--transition);
}
.cp-theme-btn:hover { background: rgba(212,166,42,0.2); }
.cp-user-info {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; border-radius: 10px;
    background: rgba(212,166,42,0.15);
    border: 1px solid rgba(212,166,42,0.3);
}
.cp-user-info__avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--primary-dark); font-weight: 800;
}
.cp-user-info__name { font-size: 13px; font-weight: 700; color: #fff; }
.cp-user-info__role { font-size: 11px; opacity: 0.85; color: var(--gold-light); }

/* Main */
.cp-main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; width: 100%;
}

/* Card */
.cp-card {
    background: var(--bg-card); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); border: 1px solid var(--border);
    max-width: 520px; width: 100%; padding: 36px 32px;
    position: relative; overflow: hidden;
    animation: slideUp 0.5s ease;
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}
.cp-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    background-size: 200% 100%;
    animation: goldShine 3s linear infinite;
}
@keyframes goldShine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.cp-card__icon {
    width: 80px; height: 80px; margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    box-shadow: 0 12px 32px rgba(11,59,35,0.35);
}
.cp-card__title {
    font-size: 24px; font-weight: 800;
    text-align: center; margin-bottom: 8px;
    color: var(--text);
}
.cp-card__subtitle {
    text-align: center; color: var(--text-muted);
    font-size: 14px; margin-bottom: 28px;
    line-height: 1.8;
}

/* Alert */
.cp-alert {
    padding: 14px 18px; border-radius: var(--radius-sm);
    font-size: 13px; margin-bottom: 20px;
    display: flex; gap: 10px; align-items: flex-start;
    line-height: 1.8;
}
.cp-alert--info {
    background: rgba(41,128,185,0.08); color: var(--info);
    border-right: 4px solid var(--info);
}
.cp-alert--warning {
    background: rgba(230,126,34,0.10); color: var(--warning);
    border-right: 4px solid var(--warning);
}
.cp-alert--error {
    background: rgba(192,57,43,0.08); color: var(--error);
    border-right: 4px solid var(--error);
}
.cp-alert--success {
    background: rgba(30,142,74,0.08); color: var(--success);
    border-right: 4px solid var(--success);
}
.cp-alert--gold {
    background: linear-gradient(135deg, rgba(212,166,42,0.12), rgba(11,59,35,0.05));
    color: var(--primary);
    border-right: 4px solid var(--gold);
}
[data-theme="dark"] .cp-alert--gold { color: var(--gold-light); }

/* Progress Steps */
.cp-steps {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-bottom: 26px;
}
.cp-step { display: flex; align-items: center; gap: 6px; }
.cp-step__num {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg-card); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px; color: var(--text-muted);
    transition: var(--transition);
}
.cp-step--active .cp-step__num {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 0 0 4px rgba(11,59,35,0.15);
}
.cp-step--done .cp-step__num {
    background: var(--success); border-color: var(--success); color: #fff;
}
.cp-step__line {
    width: 30px; height: 2px;
    background: var(--border); border-radius: 2px;
}
.cp-step__line--done { background: var(--success); }

/* Form */
.cp-field {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;
}
.cp-label {
    font-size: 14px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 6px;
}
.cp-label__required { color: var(--error); margin-right: 3px; }
.cp-input-wrap { position: relative; }
.cp-input {
    width: 100%; padding: 14px 16px;
    border-radius: var(--radius-sm); border: 2px solid var(--border);
    background: var(--bg); color: var(--text);
    font-family: monospace; font-size: 15px;
    direction: ltr; text-align: left;
    letter-spacing: 1px;
    transition: var(--transition);
}
.cp-input:focus {
    outline: none; border-color: var(--gold);
    background: var(--bg-card);
    box-shadow: 0 0 0 4px rgba(212,166,42,0.15);
}
.cp-input--error { border-color: var(--error); }
.cp-hint {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px;
}
.cp-error {
    font-size: 12px; color: var(--error); font-weight: 700;
    display: none; align-items: center; gap: 4px;
}
.cp-error--show { display: flex; }

/* Password toggle */
.cp-pwd-toggle {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    background: transparent; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 18px; padding: 8px;
    transition: var(--transition);
}
.cp-pwd-toggle:hover { color: var(--gold); }

/* Password strength */
.pwd-strength {
    display: flex; gap: 4px; margin-top: 6px;
}
.pwd-strength__bar {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--border);
    transition: var(--transition);
}
.pwd-strength__bar--weak { background: var(--error); }
.pwd-strength__bar--medium { background: var(--warning); }
.pwd-strength__bar--strong { background: var(--success); }
.pwd-strength__label {
    font-size: 11px; font-weight: 700;
    margin-top: 4px; text-align: left;
}

/* Rules checklist */
.cp-rules {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-top: 10px;
    border: 1px solid var(--border);
}
.cp-rules__title {
    font-size: 12px; font-weight: 800;
    color: var(--text-muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 4px;
}
.cp-rules__list {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px; font-size: 11px;
}
.cp-rule {
    display: flex; align-items: center; gap: 4px;
    color: var(--text-muted);
    transition: var(--transition);
}
.cp-rule__icon {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent;
    flex-shrink: 0;
    transition: var(--transition);
}
.cp-rule--ok { color: var(--success); font-weight: 700; }
.cp-rule--ok .cp-rule__icon {
    background: var(--success); color: #fff;
}

/* Buttons */
.cp-btn {
    width: 100%; padding: 15px 24px;
    border-radius: var(--radius-sm); border: none;
    font-family: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: var(--transition);
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 10px;
    text-decoration: none;
}
.cp-btn--primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    box-shadow: 0 6px 16px rgba(11,59,35,0.25);
}
.cp-btn--primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(11,59,35,0.35);
}
.cp-btn--gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--primary-dark);
    box-shadow: 0 6px 20px rgba(212,166,42,0.35);
}
.cp-btn--gold:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(212,166,42,0.5);
}
.cp-btn--ghost {
    background: transparent; color: var(--text-muted);
    border: 1.5px solid var(--border);
    margin-bottom: 0;
}
.cp-btn--ghost:hover { background: var(--bg); color: var(--text); }
.cp-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.cp-btn__spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
}
.cp-btn--primary.cp-btn--loading .cp-btn__spinner { display: block; }
.cp-btn--gold.cp-btn--loading .cp-btn__spinner {
    border-color: rgba(0,0,0,0.2);
    border-top-color: var(--primary-dark);
    display: block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Success Screen */
.cp-success {
    text-align: center; padding: 30px 20px;
}
.cp-success__icon {
    width: 100px; height: 100px; margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--success), #2ecc71);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; color: #fff;
    box-shadow: 0 12px 40px rgba(30,142,74,0.4);
    animation: pop 0.6s cubic-bezier(0.68,-0.55,0.27,1.55);
}
@keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
.cp-success__title {
    font-size: 24px; font-weight: 800;
    color: var(--success); margin-bottom: 8px;
}
.cp-success__desc {
    color: var(--text-muted); margin-bottom: 24px;
    font-size: 14px; line-height: 1.9;
}
.cp-success__countdown {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(212,166,42,0.12), rgba(11,59,35,0.05));
    color: var(--primary); padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px; font-weight: 800;
    border: 1.5px solid rgba(212,166,42,0.4);
}
[data-theme="dark"] .cp-success__countdown { color: var(--gold-light); }
.cp-success__countdown span { font-family: monospace; font-size: 20px; }

/* Footer */
.cp-footer {
    text-align: center; padding: 20px;
    color: var(--text-muted); font-size: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
}

/* Loading screen */
.loading-screen {
    text-align: center; padding: 80px 20px;
    color: var(--text-muted);
}
.loading-spinner {
    width: 50px; height: 50px; border: 4px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
}

/* Toast */
.cp-toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--primary-dark); color: #fff;
    padding: 14px 24px; border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600;
    z-index: 9999; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; align-items: center; gap: 10px;
    max-width: 90%; text-align: center;
}
.cp-toast--show { transform: translateX(-50%) translateY(0); }
.cp-toast--error { background: var(--error); }
.cp-toast--success { background: var(--success); }

/* Responsive */
@media (max-width: 640px) {
    .cp-main { padding: 20px 14px; }
    .cp-card { padding: 24px 20px; }
    .cp-card__title { font-size: 20px; }
    .cp-card__icon { width: 64px; height: 64px; font-size: 32px; }
    .cp-header__inner { gap: 8px; }
    .cp-logo { font-size: 16px; }
    .cp-logo__icon { width: 38px; height: 38px; font-size: 20px; }
    .cp-user-info { padding: 4px 8px; }
    .cp-user-info__name, .cp-user-info__role { display: none; }
    .cp-rules__list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="cp-header">
    <div class="cp-header__inner">
        <a href="javascript:history.back()" class="cp-logo">
            <div class="cp-logo__icon">🔐</div>
            <span>تغییر رمز عبور</span>
        </a>
        <div class="cp-header__actions">
            <button class="cp-theme-btn" id="themeBtn">🌙</button>
            <div class="cp-user-info" id="userInfo" style="display:none;">
                <div class="cp-user-info__avatar" id="userAvatar">؟</div>
                <div>
                    <div class="cp-user-info__name" id="userName">—</div>
                    <div class="cp-user-info__role" id="userRole">—</div>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="cp-main" id="mainContainer">
    <div class="loading-screen">
        <div class="loading-spinner"></div>
        <div>در حال بارگذاری...</div>
    </div>
</main>

<footer class="cp-footer">
    © ۱۴۰۵ — سامانه‌ی هوشمند تسلیلات وام پی
</footer>

<div class="cp-toast" id="toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastText"></span>
</div>

<script>
/* ============================================================
   WAM PAY — Change Password Script v1.0
   صفحه‌ی تغییر رمز عبور (همه‌ی نقش‌ها)
   ============================================================ */
(function () {
    'use strict';

    // ===== Config =====
    const CONFIG = {
        minPasswordLength: 8,
        salt: 'wampay_salt_v1',
        autoLogoutDelay: 5000,  // ۵ ثانیه
        allowBrokers: true,
        allowAdmins: true
    };

    // ===== State =====
    const state = {
        user: null,
        userType: null,       // 'admin' | 'broker'
        isForced: false,      // اگر mustChangePassword = true
        formData: {
            currentPassword: '',
            newPassword: '',
            confirmPassword: ''
        },
        completed: false,
        countdownTimer: null,
        remainingSeconds: 5
    };

    // ===== Helpers =====
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const faNum = (n) => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

    function nowISO() { return new Date().toISOString(); }

    // ===== Toast =====
    function toast(msg, type = 'info') {
        const el = $('#toast');
        $('#toastIcon').textContent = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        $('#toastText').textContent = msg;
        el.className = 'cp-toast cp-toast--show';
        if (type === 'error') el.classList.add('cp-toast--error');
        if (type === 'success') el.classList.add('cp-toast--success');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('cp-toast--show'), 3500);
    }

    // ===== Hash Password =====
    async function hashPassword(password) {
        try {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + CONFIG.salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
            console.warn('SHA-256 unavailable, using fallback');
            let h = 0;
            const str = password + CONFIG.salt;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) - h + str.charCodeAt(i)) | 0;
            }
            return 'simple_' + Math.abs(h).toString(16);
        }
    }

    // ===== Check Auth =====
    function checkAuth() {
        try {
            const cu = JSON.parse(localStorage.getItem('wamPayCurrentUser') || 'null');
            if (!cu) {
                toast('ابتدا وارد شوید', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
                return false;
            }

            // بررسی نوع کاربر
            const adminRoles = ['super_admin', 'deputy_admin', 'verification_admin',
                                'consultation_admin', 'broker_admin', 'legal_admin',
                                'accounting_admin', 'developer_admin'];

            if (adminRoles.includes(cu.role)) {
                state.user = cu;
                state.userType = 'admin';
            } else if (cu.role === 'broker') {
                state.user = cu;
                state.userType = 'broker';
            } else {
                toast('نقش کاربری نامعتبر', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
                return false;
            }

            // بررسی اجبار تغییر رمز
            state.isForced = !!cu.mustChangePassword;

            return true;
        } catch (e) {
            console.error('Auth error:', e);
            window.location.href = 'login.html';
            return false;
        }
    }

    // ===== Render User Info in Header =====
    function renderUserInfo() {
        if (!state.user) return;
        const avatar = state.user.name?.[0] || '؟';
        const roleLabels = {
            'super_admin': '👑 مدیر کل',
            'deputy_admin': '🎖️ معاون',
            'verification_admin': '🔍 اعتبارسنجی',
            'consultation_admin': '💬 مشاوره',
            'broker_admin': '🤝 ادمین کارگزار',
            'legal_admin': '⚖️ حقوقی',
            'accounting_admin': '💰 حسابداری',
            'developer_admin': '💻 برنامه‌نویس',
            'broker': '🤝 کارگزار'
        };
        $('#userAvatar').textContent = avatar;
        $('#userName').textContent = state.user.name || '—';
        $('#userRole').textContent = roleLabels[state.user.role] || state.user.role || '—';
        $('#userInfo').style.display = 'flex';
    }

    // ===== Password Strength =====
    function checkPasswordStrength(pwd) {
        let score = 0;
        if (pwd.length >= 8) score++;
        if (pwd.length >= 12) score++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
        if (/\d/.test(pwd)) score++;
        if (/[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/`~]/.test(pwd)) score++;

        if (score <= 2) return { level: 'weak', label: 'ضعیف', color: 'var(--error)' };
        if (score <= 3) return { level: 'medium', label: 'متوسط', color: 'var(--warning)' };
        return { level: 'strong', label: 'قوی', color: 'var(--success)' };
    }

    // ===== Password Rules Check =====
    function checkPasswordRules(pwd) {
        return {
            length: pwd.length >= CONFIG.minPasswordLength,
            lowercase: /[a-z]/.test(pwd),
            uppercase: /[A-Z]/.test(pwd),
            digit: /\d/.test(pwd),
            special: /[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/`~]/.test(pwd)
        };
    }

    // ===== Show Error =====
    function showError(id, show = true) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('cp-error--show', show);
    }

    function markInputError(id, hasError) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('cp-input--error', hasError);
    }

    // ===== Render Change Password Form =====
    function renderForm() {
        const forceMsg = state.isForced ? `
            <div class="cp-alert cp-alert--warning">
                <span>⚠️</span>
                <span>
                    <strong>تغییر رمز اجباری:</strong> به‌دلیل ملاحظات امنیتی،
                    باید رمز عبور خود را تغییر دهید تا بتوانید به سامانه دسترسی داشته باشید.
                </span>
            </div>
        ` : '';

        $('#mainContainer').innerHTML = `
            <div class="cp-card">
                <div class="cp-card__icon">🔐</div>
                <h1 class="cp-card__title">تغییر رمز عبور</h1>
                <p class="cp-card__subtitle">
                    برای حفظ امنیت حساب کاربری، رمز عبور جدید انتخاب کنید.
                </p>

                ${forceMsg}

                <!-- Progress Steps -->
                <div class="cp-steps">
                    <div class="cp-step cp-step--active" data-step="1">
                        <div class="cp-step__num">۱</div>
                    </div>
                    <div class="cp-step__line"></div>
                    <div class="cp-step" data-step="2">
                        <div class="cp-step__num">۲</div>
                    </div>
                    <div class="cp-step__line"></div>
                    <div class="cp-step" data-step="3">
                        <div class="cp-step__num">۳</div>
                    </div>
                </div>

                <!-- Form -->
                <form id="cpForm" autocomplete="off">

                    <!-- Current Password -->
                    <div class="cp-field">
                        <label class="cp-label">
                            <span>🔑</span>
                            <span>رمز عبور فعلی <span class="cp-label__required">*</span></span>
                        </label>
                        <div class="cp-input-wrap">
                            <input type="password" id="currentPassword" class="cp-input"
                                   placeholder="رمز عبور فعلی" autocomplete="current-password">
                            <button type="button" class="cp-pwd-toggle" id="toggleCurrent" tabindex="-1">👁️</button>
                        </div>
                        <div class="cp-error" id="currentPasswordError">
                            <span>⚠️</span>
                            <span>رمز عبور فعلی را وارد کنید</span>
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="cp-field">
                        <label class="cp-label">
                            <span>🆕</span>
                            <span>رمز عبور جدید <span class="cp-label__required">*</span></span>
                        </label>
                        <div class="cp-input-wrap">
                            <input type="password" id="newPassword" class="cp-input"
                                   placeholder="حداقل ۸ کاراکتر" autocomplete="new-password">
                            <button type="button" class="cp-pwd-toggle" id="toggleNew" tabindex="-1">👁️</button>
                        </div>
                        <div class="pwd-strength" id="pwdStrength" style="display:none;">
                            <div class="pwd-strength__bar"></div>
                            <div class="pwd-strength__bar"></div>
                            <div class="pwd-strength__bar"></div>
                            <div class="pwd-strength__bar"></div>
                        </div>
                        <div class="pwd-strength__label" id="pwdStrengthLabel" style="display:none;"></div>
                        <div class="cp-error" id="newPasswordError">
                            <span>⚠️</span>
                            <span>رمز عبور باید حداقل ۸ کاراکتر باشد</span>
                        </div>

                        <!-- Rules Checklist -->
                        <div class="cp-rules">
                            <div class="cp-rules__title">
                                <span>📋</span>
                                <span>الزامات رمز عبور</span>
                            </div>
                            <div class="cp-rules__list">
                                <div class="cp-rule" data-rule="length">
                                    <div class="cp-rule__icon">✓</div>
                                    <span>حداقل ۸ کاراکتر</span>
                                </div>
                                <div class="cp-rule" data-rule="lowercase">
                                    <div class="cp-rule__icon">✓</div>
                                    <span>حرف کوچک (a-z)</span>
                                </div>
                                <div class="cp-rule" data-rule="uppercase">
                                    <div class="cp-rule__icon">✓</div>
                                    <span>حرف بزرگ (A-Z)</span>
                                </div>
                                <div class="cp-rule" data-rule="digit">
                                    <div class="cp-rule__icon">✓</div>
                                    <span>عدد (0-9)</span>
                                </div>
                                <div class="cp-rule" data-rule="special">
                                    <div class="cp-rule__icon">✓</div>
                                    <span>نماد (!@#$...)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="cp-field">
                        <label class="cp-label">
                            <span>🔐</span>
                            <span>تکرار رمز عبور جدید <span class="cp-label__required">*</span></span>
                        </label>
                        <div class="cp-input-wrap">
                            <input type="password" id="confirmPassword" class="cp-input"
                                   placeholder="تکرار رمز عبور" autocomplete="new-password">
                            <button type="button" class="cp-pwd-toggle" id="toggleConfirm" tabindex="-1">👁️</button>
                        </div>
                        <div class="cp-error" id="confirmPasswordError">
                            <span>⚠️</span>
                            <span>رمز عبور جدید و تکرار آن یکسان نیستند</span>
                        </div>
                    </div>

                    <!-- Warning -->
                    <div class="cp-alert cp-alert--info">
                        <span>💡</span>
                        <span>
                            <strong>نکته:</strong> پس از تغییر رمز، به‌طور خودکار از حساب کاربری
                            <strong>خارج می‌شوید</strong> و باید با رمز جدید وارد شوید.
                        </span>
                    </div>

                    <!-- Buttons -->
                    <button type="submit" class="cp-btn cp-btn--primary" id="submitBtn">
                        <span class="cp-btn__spinner"></span>
                        <span>🔐 تغییر رمز عبور</span>
                    </button>

                    <a href="javascript:history.back()" class="cp-btn cp-btn--ghost">
                        → بازگشت
                    </a>
                </form>
            </div>
        `;

        // Attach events
        attachFormEvents();

        // Show user info in header
        renderUserInfo();

        // If forced, disable back button
        if (state.isForced) {
            const backBtn = document.querySelector('.cp-btn--ghost');
            if (backBtn) {
                backBtn.style.opacity = '0.5';
                backBtn.style.pointerEvents = 'none';
                backBtn.title = 'تغییر رمز اجباری است';
            }
        }
    }

    // ===== Attach Form Events =====
    function attachFormEvents() {
        // Password visibility toggles
        const toggles = [
            { btn: '#toggleCurrent', input: '#currentPassword' },
            { btn: '#toggleNew', input: '#newPassword' },
            { btn: '#toggleConfirm', input: '#confirmPassword' }
        ];

        toggles.forEach(t => {
            const btn = document.querySelector(t.btn);
            const inp = document.querySelector(t.input);
            if (!btn || !inp) return;
            btn.addEventListener('click', () => {
                const isPwd = inp.type === 'password';
                inp.type = isPwd ? 'text' : 'password';
                btn.textContent = isPwd ? '🙈' : '👁️';
            });
        });

        // New password: strength + rules
        $('#newPassword')?.addEventListener('input', (e) => {
            const pwd = e.target.value;
            updatePasswordStrength(pwd);
            updatePasswordRules(pwd);
            updateStepProgress();
        });

        // Form submit
        $('#cpForm')?.addEventListener('submit', handleSubmit);

        // Enter to submit
        ['#currentPassword', '#newPassword', '#confirmPassword'].forEach(sel => {
            document.querySelector(sel)?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    $('#cpForm')?.dispatchEvent(new Event('submit'));
                }
            });
        });
    }

    // ===== Update Password Strength =====
    function updatePasswordStrength(pwd) {
        const strength = $('#pwdStrength');
        const label = $('#pwdStrengthLabel');
        if (!strength || !label) return;

        if (!pwd) {
            strength.style.display = 'none';
            label.style.display = 'none';
            return;
        }

        strength.style.display = 'flex';
        label.style.display = 'block';

        const result = checkPasswordStrength(pwd);
        const bars = strength.querySelectorAll('.pwd-strength__bar');
        bars.forEach((bar, i) => {
            bar.className = 'pwd-strength__bar';
            if (result.level === 'weak' && i < 1) bar.classList.add('pwd-strength__bar--weak');
            else if (result.level === 'medium' && i < 2) bar.classList.add('pwd-strength__bar--medium');
            else if (result.level === 'strong' && i < 4) bar.classList.add('pwd-strength__bar--strong');
        });

        label.textContent = `قدرت رمز: ${result.label}`;
        label.style.color = result.color;
    }

    // ===== Update Password Rules =====
    function updatePasswordRules(pwd) {
        const rules = checkPasswordRules(pwd);
        Object.keys(rules).forEach(key => {
            const el = document.querySelector(`.cp-rule[data-rule="${key}"]`);
            if (el) {
                el.classList.toggle('cp-rule--ok', rules[key]);
            }
        });
    }

    // ===== Update Step Progress =====
    function updateStepProgress() {
        const current = $('#currentPassword')?.value;
        const newPwd = $('#newPassword')?.value;
        const confirm = $('#confirmPassword')?.value;

        const steps = $$('.cp-step');
        const lines = $$('.cp-step__line');

        if (steps.length < 3) return;

        // Step 1: Current password
        if (current && current.length >= 1) {
            steps[0].classList.add('cp-step--done');
            lines[0]?.classList.add('cp-step__line--done');
        } else {
            steps[0].classList.remove('cp-step--done');
            lines[0]?.classList.remove('cp-step__line--done');
        }

        // Step 2: New password
        if (newPwd && newPwd.length >= CONFIG.minPasswordLength) {
            steps[1].classList.add('cp-step--done');
            lines[1]?.classList.add('cp-step__line--done');
        } else {
            steps[1].classList.remove('cp-step--done');
            lines[1]?.classList.remove('cp-step__line--done');
        }

        // Step 3: Confirm
        if (confirm && confirm === newPwd) {
            steps[2].classList.add('cp-step--done');
        } else {
            steps[2].classList.remove('cp-step--done');
        }
    }

    // ===== Handle Submit =====
    async function handleSubmit(e) {
        e.preventDefault();

        const currentPassword = $('#currentPassword')?.value || '';
        const newPassword = $('#newPassword')?.value || '';
        const confirmPassword = $('#confirmPassword')?.value || '';

        // Reset errors
        ['currentPasswordError', 'newPasswordError', 'confirmPasswordError'].forEach(id => showError(id, false));
        ['currentPassword', 'newPassword', 'confirmPassword'].forEach(id => markInputError(id, false));

        let ok = true;

        // Validate current
        if (!currentPassword) {
            showError('currentPasswordError', true);
            markInputError('currentPassword', true);
            ok = false;
        }

        // Validate new password
        if (newPassword.length < CONFIG.minPasswordLength) {
            showError('newPasswordError', true);
            markInputError('newPassword', true);
            ok = false;
        }

        // Validate match
        if (newPassword !== confirmPassword) {
            showError('confirmPasswordError', true);
            markInputError('confirmPassword', true);
            ok = false;
        }

        // Check if new == current
        if (newPassword && newPassword === currentPassword) {
            showError('newPasswordError', true);
            markInputError('newPassword', true);
            $('#newPasswordError').querySelector('span:last-child').textContent =
                'رمز جدید نباید با رمز فعلی یکسان باشد';
            ok = false;
        }

        if (!ok) {
            toast('لطفاً خطاها را برطرف کنید', 'error');
            return;
        }

        // Show loading
        const btn = $('#submitBtn');
        btn.classList.add('cp-btn--loading');
        btn.disabled = true;

        try {
            // Hash current and new passwords
            const currentHash = await hashPassword(currentPassword);
            const newHash = await hashPassword(newPassword);

            // Find user in admins OR users
            let userList, storageKey, userIndex;

            if (state.userType === 'admin') {
                storageKey = 'wamPayAdmins';
                userList = JSON.parse(localStorage.getItem(storageKey) || '[]');
            } else {
                storageKey = 'wamPayUsers';
                userList = JSON.parse(localStorage.getItem(storageKey) || '[]');
            }

            userIndex = userList.findIndex(u => u.id === state.user.id);

            if (userIndex < 0) {
                toast('کاربر یافت نشد', 'error');
                btn.classList.remove('cp-btn--loading');
                btn.disabled = false;
                return;
            }

            // Verify current password
            const existingPassword = userList[userIndex].password;
            if (existingPassword !== currentHash && existingPassword !== currentPassword) {
                // Also check plain text comparison for backward compatibility
                showError('currentPasswordError', true);
                markInputError('currentPassword', true);
                $('#currentPasswordError').querySelector('span:last-child').textContent =
                    'رمز عبور فعلی صحیح نیست';
                toast('رمز عبور فعلی اشتباه است', 'error');
                btn.classList.remove('cp-btn--loading');
                btn.disabled = false;
                return;
            }

            // Update password
            userList[userIndex].password = newHash;
            userList[userIndex].mustChangePassword = false;
            userList[userIndex].updatedAt = nowISO();
            userList[userIndex].passwordChangedAt = nowISO();

            // Save
            localStorage.setItem(storageKey, JSON.stringify(userList));

            // Log
            try {
                const logs = JSON.parse(localStorage.getItem('wamPayPasswordLog') || '[]');
                logs.unshift({
                    id: 'pwd_' + Date.now(),
                    userId: state.user.id,
                    userName: state.user.name,
                    userRole: state.user.role,
                    action: 'password_changed',
                    at: nowISO(),
                    forced: state.isForced
                });
                if (logs.length > 200) logs.length = 200;
                localStorage.setItem('wamPayPasswordLog', JSON.stringify(logs));
            } catch (e) { /* silent */ }

            // Clear current session
            state.completed = true;

            console.log('🔐 [ChangePassword] رمز عبور تغییر کرد:', state.user.name);

            // Show success screen with auto logout
            renderSuccessScreen();

        } catch (err) {
            console.error('Change password error:', err);
            toast('خطا در تغییر رمز، دوباره تلاش کنید', 'error');
            btn.classList.remove('cp-btn--loading');
            btn.disabled = false;
        }
    }

    // ===== Render Success Screen =====
    function renderSuccessScreen() {
        $('#mainContainer').innerHTML = `
            <div class="cp-card">
                <div class="cp-success">
                    <div class="cp-success__icon">✓</div>
                    <h1 class="cp-success__title">رمز عبور با موفقیت تغییر کرد!</h1>
                    <p class="cp-success__desc">
                        از این پس باید با رمز عبور جدید وارد شوید.
                        <br>در حال خروج از حساب و انتقال به صفحه‌ی ورود...
                    </p>

                    <div class="cp-success__countdown">
                        <span>⏱️</span>
                        <span>خروج خودکار در <span id="countdownValue">${faNum(state.remainingSeconds)}</span> ثانیه</span>
                    </div>

                    <div style="margin-top:20px;">
                        <a href="login.html" class="cp-btn cp-btn--primary" style="text-decoration:none;">
                            <span>🚀 ورود با رمز جدید</span>
                        </a>
                    </div>
                </div>
            </div>
        `;

        toast('✅ رمز عبور با موفقیت تغییر کرد', 'success');

        // Auto logout countdown
        startLogoutCountdown();
    }

    // ===== Start Logout Countdown =====
    function startLogoutCountdown() {
        state.remainingSeconds = Math.ceil(CONFIG.autoLogoutDelay / 1000);

        const updateCountdown = () => {
            const el = $('#countdownValue');
            if (el) el.textContent = faNum(state.remainingSeconds);

            if (state.remainingSeconds <= 0) {
                clearInterval(state.countdownTimer);
                performLogout();
                return;
            }

            state.remainingSeconds--;
        };

        updateCountdown();
        state.countdownTimer = setInterval(updateCountdown, 1000);
    }

    // ===== Perform Logout =====
    function performLogout() {
        try {
            localStorage.removeItem('wamPayCurrentUser');
            localStorage.removeItem('wamPayToken');
            // Clear sessionStorage drafts
            try {
                sessionStorage.removeItem('wamPayBrokerFileNumber');
                sessionStorage.removeItem('wamPayNewCaseNumber');
            } catch (e) {}
            console.log('🚪 [ChangePassword] خروج موفق');
            window.location.href = 'login.html';
        } catch (e) {
            console.error('Logout error:', e);
            window.location.href = 'login.html';
        }
    }

    // ===== Theme =====
    function initTheme() {
        const saved = localStorage.getItem('wamPayTheme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        const btn = $('#themeBtn');
        if (!btn) return;
        btn.textContent = saved === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('wamPayTheme', 'light');
                btn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('wamPayTheme', 'dark');
                btn.textContent = '☀️';
            }
        });
    }

    // ===== Confirm Password live check =====
    function setupConfirmCheck() {
        const confirmInput = document.querySelector('#confirmPassword');
        if (!confirmInput) return;
        confirmInput.addEventListener('input', () => {
            updateStepProgress();
        });
        const currentInput = document.querySelector('#currentPassword');
        if (currentInput) {
            currentInput.addEventListener('input', () => {
                updateStepProgress();
            });
        }
    }

    // ===== Init =====
    function init() {
        initTheme();

        // Check auth
        if (!checkAuth()) return;

        // Render form
        renderForm();

        // Setup confirm check
        setupConfirmCheck();

        console.log('%c🔐 WAM PAY — Change Password v1.0', 'color:#0b3b23;font-weight:bold;font-size:14px;');
        console.log('%c👤 کاربر:', 'color:#d4a62a;font-weight:bold;', state.user.name, '(' + state.user.role + ')');
        console.log('%c📊 نوع:', 'color:#d4a62a;font-weight:bold;', state.userType);
        console.log('%c🔒 اجباری:', 'color:#d4a62a;font-weight:bold;', state.isForced);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
